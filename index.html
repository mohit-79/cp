<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VenGeance ⚡</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/ayu-mirage.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/eclipse.min.css">

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/edit/matchbrackets.min.js"></script>

<style>
:root[data-theme="dark"] {
  --bg-main:#0d1117; --bg-sidebar:#161b22; --bg-card:#21262d;
  --bg-hover:#30363d; --border:#30363d; --text-primary:#c9d1d9;
  --text-secondary:#8b949e; --accent:#58a6ff; --success:#238636;
  --danger:#f85149; --gold:#e3b341; --tag-bg:#1f2428;
  --progress-fill:rgba(35,134,54,0.4); --progress-bg:#21262d;
  --tab-active:#1f2428; --tab-inactive:#161b22;
  --highlight:rgba(210,153,34,0.3); --modal-bg:rgba(0,0,0,0.6);
}
:root[data-theme="light"] {
  --bg-main:#ffffff; --bg-sidebar:#f6f8fa; --bg-card:#ffffff;
  --bg-hover:#eaeef2; --border:#d0d7de; --text-primary:#24292f;
  --text-secondary:#57606a; --accent:#0969da; --success:#1a7f37;
  --danger:#cf222e; --gold:#d29922; --tag-bg:#eff1f3;
  --progress-fill:rgba(26,127,55,0.25); --progress-bg:#ffffff;
  --tab-active:#ffffff; --tab-inactive:#f6f8fa;
  --highlight:rgba(210,153,34,0.3); --modal-bg:rgba(0,0,0,0.4);
}
.u-gray{background:#808080;color:#fff} .u-green{background:#008000;color:#fff}
.u-cyan{background:#03a89e;color:#fff}  .u-blue{background:#0000ff;color:#fff}
.u-violet{background:#aa00aa;color:#fff}.u-orange{background:#ff8c00;color:#fff}
.u-red{background:#ff0000;color:#fff}

*{box-sizing:border-box;outline:none}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
     background:var(--bg-main);color:var(--text-primary);display:flex;height:100vh;overflow:hidden}

/* ── SIDEBAR ── */
#sidebar{width:480px;background:var(--bg-sidebar);display:flex;flex-direction:column;
         flex-shrink:0;border-right:1px solid var(--border);position:relative}
.header-panel{padding:10px;border-bottom:1px solid var(--border);
              background:var(--bg-sidebar);display:flex;flex-direction:column;gap:7px}
.top-row{display:flex;justify-content:space-between;align-items:center;height:28px}
.brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:6px}
.top-actions{display:flex;align-items:center;gap:6px}
#user-avatar{width:24px;height:24px;border-radius:50%;border:1px solid var(--border);display:none}
.control-row{display:flex;gap:6px;height:32px}
input[type="text"],input[type="number"]{background:var(--bg-main);border:1px solid var(--border);
  color:var(--text-primary);padding:4px 10px;border-radius:6px;flex:1;font-size:0.9rem}
input:focus{border-color:var(--accent)}
#user-info-row{display:none;align-items:center;gap:8px;font-size:0.8rem}
#rating-pill{padding:1px 6px;border-radius:4px;font-weight:bold;font-size:0.75rem}
#profile-link{text-decoration:none;color:var(--text-secondary);display:flex;align-items:center;gap:3px}
#profile-link:hover{color:var(--accent)}
.btn{background:var(--bg-card);border:1px solid var(--border);color:var(--text-primary);
     padding:0 12px;border-radius:6px;cursor:pointer;font-size:0.85rem;font-weight:600;
     display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.btn:hover{background:var(--bg-hover)}
.btn-primary{background:var(--success);border-color:var(--success);color:#fff}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-sm{font-size:0.75rem;padding:2px 8px;height:24px}
.filter-row{display:flex;align-items:center;gap:8px;font-size:0.82rem;
            color:var(--text-secondary);flex-wrap:wrap}
.filter-item{display:flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
select{background:var(--bg-main);color:var(--text-primary);border:1px solid var(--border);
       border-radius:4px;padding:2px 4px;font-size:0.8rem;outline:none;cursor:pointer;height:24px}
/* rating range inputs */
.rating-range{display:flex;align-items:center;gap:4px;font-size:0.8rem}
.rating-range input{width:60px;height:24px;padding:2px 6px;font-size:0.78rem;flex:none}
#bg-stats{font-size:0.73rem;color:var(--accent);height:13px;white-space:nowrap;overflow:hidden}

/* tag filter bar */
#tag-filter-row{display:none;flex-wrap:wrap;gap:4px;padding:4px 0;max-height:72px;overflow-y:auto}
.tag-filter-pill{font-size:0.72rem;padding:1px 8px;border-radius:12px;border:1px solid var(--border);
                 background:var(--tag-bg);color:var(--text-secondary);cursor:pointer;white-space:nowrap}
.tag-filter-pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* contest list */
#contest-list,#bookmark-list{flex:1;overflow-y:auto;padding:10px;scroll-behavior:smooth}
#bookmark-list{display:none}
.contest-card{background:var(--bg-card);border:1px solid var(--border);
              border-radius:6px;margin-bottom:8px;overflow:hidden}
.contest-header{padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;
                align-items:center;background:var(--progress-bg);transition:background 0.4s}
.contest-header:hover{opacity:0.88}
.contest-meta{display:flex;align-items:center;gap:6px}
.cid-tag{background:var(--tag-bg);padding:2px 6px;border-radius:4px;font-size:0.73rem;color:var(--text-secondary)}
.solved-badge{font-size:0.72rem;color:var(--success);font-weight:600}
.contest-body{max-height:0;overflow:hidden;transition:max-height 0.3s ease;
              border-top:1px solid transparent;background:var(--bg-card)}
.contest-card.open .contest-body{max-height:6000px;border-top-color:var(--border)}

/* problem rows */
.problem-row{display:grid;grid-template-columns:22px 34px 1fr 64px;align-items:start;
             padding:9px 12px;border-bottom:1px solid var(--border);background:var(--bg-sidebar);
             gap:8px;transition:background 0.3s}
.problem-row:hover{background:var(--bg-hover)}
.problem-row.solved{border-left:3px solid var(--success);background:rgba(35,134,54,0.07)}
.problem-row.attempted:not(.solved){border-left:3px solid var(--gold)}
.problem-row.highlight-row{animation:flash 2s ease-out;border-left:3px solid var(--gold)}
@keyframes flash{0%{background:var(--highlight)}100%{background:var(--bg-sidebar)}}
.p-status{text-align:center;padding-top:2px;font-size:0.9rem}
.p-index{font-weight:700;color:var(--accent);padding-top:2px;font-size:0.88rem}
.p-content{display:flex;flex-direction:column;gap:5px;overflow:hidden;min-width:0}
.p-name{font-weight:500;font-size:0.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topic-list{display:flex;gap:4px;flex-wrap:wrap}
.topic-pill{font-size:0.71rem;background:var(--tag-bg);color:var(--text-secondary);
            padding:1px 6px;border-radius:12px;white-space:nowrap;border:1px solid var(--border);
            cursor:pointer;transition:background 0.15s}
.topic-pill:hover{background:var(--bg-hover);color:var(--text-primary)}
.topic-pill.rating-pill{color:#d19a66;border-color:#d19a66;font-weight:700;cursor:default}
[data-theme="light"] .topic-pill.rating-pill{color:#b07d47;border-color:#b07d47}
.p-actions{display:flex;gap:3px;justify-content:flex-end;align-items:flex-start;padding-top:1px}
.icon-btn{background:transparent;border:1px solid transparent;cursor:pointer;font-size:0.95rem;
          padding:2px 4px;opacity:0.55;transition:0.15s;border-radius:4px}
.icon-btn:hover{opacity:1;background:var(--bg-hover);border-color:var(--border)}
.icon-btn.starred{color:var(--gold);opacity:1}
.icon-btn.has-note{color:var(--accent);opacity:1}

/* ── MAIN / EDITOR ── */
#main-content{flex:1;display:flex;flex-direction:column;background:var(--bg-main);min-width:0}
#editor-container{display:none;flex-direction:column;height:100%}
.editor-header{background:var(--bg-sidebar);border-bottom:1px solid var(--border);display:flex;flex-direction:column}
.editor-tabs{display:flex;gap:2px;padding:0 10px;margin-top:10px}
.tab-btn{padding:6px 14px;font-size:0.83rem;font-weight:600;cursor:pointer;border-radius:6px 6px 0 0;
         background:var(--tab-inactive);border:1px solid var(--border);border-bottom:none;opacity:0.65}
.tab-btn.active{background:var(--tab-active);opacity:1;border-top:2px solid var(--accent)}
.editor-toolbar{padding:7px 12px;display:flex;justify-content:space-between;align-items:center;
                border-bottom:1px solid var(--border);background:var(--tab-active);gap:6px;flex-wrap:wrap}
.toolbar-left{display:flex;align-items:center;gap:8px;min-width:0}
.toolbar-right{display:flex;align-items:center;gap:5px;flex-shrink:0}
#active-title{font-weight:700;font-size:0.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
#active-title a{color:var(--text-primary);text-decoration:none}
#active-title a:hover{color:var(--accent);text-decoration:underline}
.save-status{font-size:0.73rem;color:var(--text-secondary);font-style:italic}
#lang-select{height:26px;font-size:0.78rem;padding:0 4px}
.CodeMirror{flex:1;font-family:'Fira Code','Cascadia Code',monospace;font-size:13.5px;height:100%}
.CodeMirror-scroll{height:100%}
#cm-wrap{flex:1;overflow:hidden;display:flex;flex-direction:column}
#cm-wrap .CodeMirror{height:100%;flex:1}

/* ── EMPTY STATE ── */
#empty-state{flex:1;display:flex;flex-direction:column;align-items:center;
             justify-content:center;color:var(--text-secondary);gap:8px}
#empty-state h2{margin:0;font-size:1.3rem}
#empty-state p{margin:0;font-size:0.88rem}

/* ── STATS PANEL ── */
#stats-panel{display:none;flex:1;flex-direction:column;overflow-y:auto;padding:20px}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;
           padding:14px;text-align:center}
.stat-num{font-size:1.6rem;font-weight:700;color:var(--accent)}
.stat-label{font-size:0.78rem;color:var(--text-secondary);margin-top:2px}
.rating-bars{background:var(--bg-card);border:1px solid var(--border);
             border-radius:8px;padding:14px;margin-bottom:12px}
.rating-bars h3{margin:0 0 10px;font-size:0.88rem;color:var(--text-secondary)}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:0.8rem}
.bar-label{width:38px;text-align:right;color:var(--text-secondary);flex-shrink:0}
.bar-track{flex:1;background:var(--bg-hover);border-radius:4px;height:14px;position:relative;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:var(--success);transition:width 0.5s}
.bar-count{width:28px;text-align:left;color:var(--text-primary);font-weight:600}

/* ── RANDOM PICKER MODAL ── */
#random-modal{display:none;position:fixed;inset:0;background:var(--modal-bg);z-index:100;
              align-items:center;justify-content:center}
#random-modal.show{display:flex}
.modal-box{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;
           padding:20px;width:340px;display:flex;flex-direction:column;gap:12px}
.modal-box h3{margin:0;font-size:1rem}
.modal-row{display:flex;align-items:center;gap:8px;font-size:0.85rem}
.modal-row label{width:80px;color:var(--text-secondary);flex-shrink:0}
.modal-result{background:var(--bg-main);border:1px solid var(--border);border-radius:6px;
              padding:10px 12px;font-size:0.85rem;min-height:44px;display:flex;
              align-items:center;color:var(--text-secondary)}
.modal-result a{color:var(--accent);text-decoration:none;font-weight:600}
.modal-result a:hover{text-decoration:underline}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}

/* ── INFRA ── */
#cloud-loader{height:2px;background:linear-gradient(90deg,var(--accent),var(--success));
              width:0%;transition:0.3s;position:absolute;top:0;left:0;z-index:50}
#resizer{width:5px;cursor:col-resize;background:transparent;
         position:absolute;right:0;top:0;bottom:0;z-index:10}
/* scrollbar */
#contest-list::-webkit-scrollbar,#bookmark-list::-webkit-scrollbar,
#stats-panel::-webkit-scrollbar,#tag-filter-row::-webkit-scrollbar{width:5px}
#contest-list::-webkit-scrollbar-thumb,#bookmark-list::-webkit-scrollbar-thumb,
#stats-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
</head>
<body>

<!-- ═══════════════════ SIDEBAR ═══════════════════ -->
<div id="sidebar">
  <div id="cloud-loader"></div>
  <div class="header-panel">

    <!-- top row -->
    <div class="top-row">
      <div class="brand">⚡ VenGeance</div>
      <div class="top-actions">
        <img id="user-avatar" src="" title="Logged In">
        <button class="btn btn-sm" id="authBtn" onclick="handleAuth()">Login</button>
        <button class="btn btn-sm" onclick="openRandomModal()" title="Random Problem">🎲</button>
        <button class="btn btn-sm" onclick="toggleStatsPanel()" title="Stats">📊</button>
        <button class="btn btn-sm" onclick="toggleTheme()" title="Theme">🌙</button>
      </div>
    </div>

    <!-- handle + sync -->
    <div class="control-row">
      <input type="text" id="handleInput" placeholder="CF Handle">
      <button class="btn btn-primary" id="syncBtn" onclick="syncUser()">↻ Sync</button>
      <button class="btn" id="bmBtn" onclick="toggleBookmarksView()" title="Bookmarks">★</button>
    </div>

    <!-- user info -->
    <div id="user-info-row">
      <span id="rating-pill"></span>
      <a id="profile-link" href="#" target="_blank">↗ Profile</a>
      <span id="solved-count-badge" style="font-size:0.75rem;color:var(--success);margin-left:auto"></span>
    </div>

    <!-- search -->
    <div class="control-row">
      <input type="text" id="problemSearch" placeholder="Jump to problem (e.g. 4A, 1600B)"
             onkeyup="if(event.key==='Enter')searchProblem()">
      <button class="btn" onclick="searchProblem()">→</button>
    </div>

    <!-- filters row 1 -->
    <div class="filter-row">
      <select id="divFilter" onchange="applyFilters()">
        <option value="ALL">All Divs</option>
        <option value="Div. 1">Div 1</option>
        <option value="Div. 2">Div 2</option>
        <option value="Div. 3">Div 3</option>
        <option value="Div. 4">Div 4</option>
        <option value="Educational">Educational</option>
        <option value="Global">Global</option>
      </select>
      <label class="filter-item">
        <input type="checkbox" id="roundFilter" checked onchange="applyFilters()"> Std.
      </label>
      <label class="filter-item" style="color:var(--accent)">
        <input type="checkbox" id="attemptedFilter" onchange="applyFilters()"> Attempted
      </label>
      <label class="filter-item" style="color:var(--danger)">
        <input type="checkbox" id="unsolvedFilter" onchange="applyFilters()"> Unsolved
      </label>
    </div>

    <!-- filters row 2: rating range + tag toggle -->
    <div class="filter-row">
      <span style="color:var(--text-secondary);font-size:0.8rem">Rating:</span>
      <div class="rating-range">
        <input type="number" id="ratingMin" placeholder="800"  min="800"  max="3500" step="100" onchange="applyFilters()" style="width:58px">
        <span style="color:var(--text-secondary)">–</span>
        <input type="number" id="ratingMax" placeholder="3500" min="800"  max="3500" step="100" onchange="applyFilters()" style="width:58px">
      </div>
      <button class="btn btn-sm" onclick="toggleTagFilter()" id="tagToggleBtn">🏷 Tags</button>
      <button class="btn btn-sm" onclick="clearAllFilters()" title="Reset filters" style="color:var(--text-secondary)">✕</button>
    </div>

    <!-- tag filter pills (hidden by default) -->
    <div id="tag-filter-row"></div>

    <div id="bg-stats"></div>
  </div>

  <div id="contest-list"><div id="sentinel" style="height:20px"></div></div>
  <div id="bookmark-list"></div>
  <div id="resizer"></div>
</div>

<!-- ═══════════════════ MAIN CONTENT ═══════════════════ -->
<div id="main-content">

  <!-- Empty state -->
  <div id="empty-state">
    <div style="font-size:2.5rem">⚡</div>
    <h2>VenGeance</h2>
    <p id="cloud-status">Sync your handle to track progress</p>
    <p style="font-size:0.78rem;margin-top:4px;color:var(--text-secondary)">Click a problem's ✎ to open notes &amp; editor</p>
  </div>

  <!-- Stats panel -->
  <div id="stats-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="margin:0;font-size:1.1rem">📊 My Stats</h2>
      <button class="btn btn-sm" onclick="toggleStatsPanel()">✕ Close</button>
    </div>
    <div class="stats-grid" id="stats-grid"></div>
    <div class="rating-bars" id="rating-bars"></div>
  </div>

  <!-- Editor -->
  <div id="editor-container">
    <div class="editor-header">
      <div class="editor-tabs">
        <div class="tab-btn active" id="tab-notes"    onclick="switchTab('notes')">📝 Notes</div>
        <div class="tab-btn"        id="tab-solution" onclick="switchTab('solution')">✅ My Solution</div>
      </div>
      <div class="editor-toolbar">
        <div class="toolbar-left">
          <span id="active-title">Problem</span>
          <span class="save-status" id="save-indicator">Saved</span>
        </div>
        <div class="toolbar-right">
          <select id="lang-select" class="btn btn-sm" onchange="changeLang(this.value)" style="padding:0 6px">
            <option value="cpp">C++</option>
            <option value="python">Python</option>
            <option value="java">Java</option>
          </select>
          <button class="btn btn-sm" id="view-sub-btn" onclick="openExternalSub()" style="display:none">↗ CF</button>
          <button class="btn btn-sm" onclick="copyCode()">Copy</button>
          <button class="btn btn-sm btn-primary" onclick="submitToCF()">Submit ↗</button>
          <button class="btn btn-sm" onclick="closeEditor()" style="color:var(--danger);border-color:var(--danger)">✕</button>
        </div>
      </div>
    </div>
    <div id="cm-wrap">
      <textarea id="code-editor"></textarea>
    </div>
  </div>
</div>

<!-- ═══════════════════ RANDOM MODAL ═══════════════════ -->
<div id="random-modal">
  <div class="modal-box">
    <h3>🎲 Random Problem</h3>
    <div class="modal-row">
      <label>Min rating</label>
      <input type="number" id="rand-min" value="800"  min="800"  max="3500" step="100" style="width:90px">
    </div>
    <div class="modal-row">
      <label>Max rating</label>
      <input type="number" id="rand-max" value="1600" min="800"  max="3500" step="100" style="width:90px">
    </div>
    <div class="modal-row">
      <label>Only unsolved</label>
      <input type="checkbox" id="rand-unsolved" checked>
    </div>
    <div class="modal-result" id="rand-result">Press "Pick" to get a problem.</div>
    <div class="modal-actions">
      <button class="btn" onclick="closeRandomModal()">Close</button>
      <button class="btn btn-primary" onclick="pickRandom()">🎲 Pick</button>
    </div>
  </div>
</div>

<script>

auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});

// ═══════════════════════════════════════════════════════
// LOCAL STORAGE HELPERS

function lsGet(k, fb=null){try{const v=localStorage.getItem(k);return v===null?fb:JSON.parse(v)}catch{return fb}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){console.warn('lsSet fail',k,e);return false}}
function lsRaw(k){return localStorage.getItem(k)}
function lsRawSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch{}}

// ═══════════════════════════════════════════════════════
// PROBLEMS — single fetch replaces contest.standings
// ═══════════════════════════════════════════════════════
const PROBLEMS_KEY = 'cf_all_problems_v2';
const PROBLEMS_TTL = 6 * 60 * 60 * 1000; // 6 hours

function buildProblemMap(problems) {
  state.problemsByContest.clear();
  state.allTags.clear();
  state.allProblems = problems;
  for (const p of problems) {
    if (!p.contestId) continue;
    if (!state.problemsByContest.has(p.contestId)) state.problemsByContest.set(p.contestId,[]);
    state.problemsByContest.get(p.contestId).push(p);
    (p.tags||[]).forEach(t => state.allTags.add(t));
  }
  for (const [,probs] of state.problemsByContest)
    probs.sort((a,b)=>a.index<b.index?-1:1);
  state.problemsReady = true;
  renderTagFilterBar();
  setStats('');
}

async function fetchAllProblems(force=false) {
  if (state.problemsFetching) return;
  const raw = lsGet(PROBLEMS_KEY,null);
  if (!force && raw && Array.isArray(raw.problems) && (Date.now()-(raw.ts||0))<PROBLEMS_TTL) {
    buildProblemMap(raw.problems); return;
  }
  state.problemsFetching = true;
  setStats('Fetching problems…');
  try {
    const res  = await fetch('https://codeforces.com/api/problemset.problems');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (data.status !== 'OK') throw new Error(data.comment||'API error');
    const problems = data.result.problems;
    lsSet(PROBLEMS_KEY,{problems,ts:Date.now()});
    buildProblemMap(problems);
    // re-render open contest bodies
    document.querySelectorAll('.contest-card.open').forEach(card=>{
      const body=card.querySelector('.contest-body');
      if (body.dataset.loaded!=='true') renderContestBody(body,+card.dataset.cid);
    });
    setStats('Problems loaded ✓'); setTimeout(()=>setStats(''),3000);
  } catch(e) {
    console.error('fetchAllProblems',e);
    setStats(`⚠ ${e.message} — try refreshing`);
  }
  state.problemsFetching = false;
}

async function loadUserData(uid){
  document.getElementById('cloud-loader').style.width='70%';
  try{
    const doc=await db.collection('users').doc(uid).get();
    if (doc.exists){
      const d=doc.data();
      if (d.cfHandle){
        document.getElementById('handleInput').value=d.cfHandle;
        localStorage.setItem('cf_handle',d.cfHandle);
        syncUser(false);
      }
      if (d.bookmarks && Object.keys(d.bookmarks).length>0){
        // Cloud bookmarks take priority; merge with local (cloud wins on conflict)
        const cloudMap=new Map(Object.entries(d.bookmarks));
        // Merge: start from local, then overwrite with cloud entries
        const merged=new Map([...state.bookmarks,...cloudMap]);
        state.bookmarks=merged;
        lsSet('cf_bookmarks_map',[...state.bookmarks]); // keep local in sync
      } else if (state.bookmarks.size>0){
        // No cloud bookmarks yet but we have local ones — push them up
        db.collection('users').doc(uid).set(
          {bookmarks:Object.fromEntries(state.bookmarks)},{merge:true}
        ).catch(()=>{});
      }
    }
  }catch(e){console.error('loadUserData',e)}
  document.getElementById('cloud-loader').style.width='0%';
}

async function syncUser(showUI=true){
  const h=document.getElementById('handleInput').value.trim();
  if (!h) return;
  localStorage.setItem('cf_handle',h);
  if (state.user) db.collection('users').doc(state.user.uid).set({cfHandle:h},{merge:true});
  const btn=document.getElementById('syncBtn');
  if (showUI){btn.innerText='…';btn.disabled=true}
  fetchUserInfo(h);
  try{
    const res=await fetch(`https://codeforces.com/api/user.status?handle=${encodeURIComponent(h)}`);
    const data=await res.json();
    if (data.status==='OK'){
      state.solved.clear(); state.attempted.clear();
      state.attemptedContests.clear(); state.submissionMap.clear();

      data.result.forEach(s=>{
        state.attemptedContests.add(s.contestId);
        const pid=`${s.contestId}${s.problem.index}`;
        state.attempted.add(pid);
        if (s.verdict==='OK' && !state.submissionMap.has(pid)){
          state.solved.add(pid);
          state.submissionMap.set(pid,s.id);
        }
      });

      lsSet('cf_cache_solved',[...state.solved]);
      lsSet('cf_cache_attempted',[...state.attempted]);
      lsSet('cf_cache_attempted_contests',[...state.attemptedContests]);
      lsSet('cf_cache_submission_map',[...state.submissionMap]);

      // refresh visible rows
      document.querySelectorAll('.problem-row').forEach(row=>{
        const pid=row.id.replace('row-','');
        row.classList.toggle('solved', state.solved.has(pid));
        row.classList.toggle('attempted', state.attempted.has(pid)&&!state.solved.has(pid));
        row.querySelector('.p-status').innerText = state.solved.has(pid)?'✅':
          state.attempted.has(pid)?'⚡':'';
      });
      applyFilters();
      updateSolvedBadge();
      if (showUI) btn.innerText='✓';
    } else {
      if (showUI) btn.innerText='✗';
      alert('CF API error: '+(data.comment||'unknown'));
    }
  }catch(e){
    console.error('syncUser',e);
    if (showUI) btn.innerText='!';
  }
  btn.disabled=false;
  setTimeout(()=>btn.innerText='↻ Sync',2000);
}

async function fetchUserInfo(handle){
  try{
    const res=await fetch(`https://codeforces.com/api/user.info?handles=${encodeURIComponent(handle)}`);
    const data=await res.json();
    if (data.status==='OK'&&data.result.length>0){
      const u=data.result[0], r=u.rating||0;
      const pill=document.getElementById('rating-pill');
      pill.innerText=`${u.rank||'user'} (${r})`;
      pill.className='rating-pill';
      if(r<1200)pill.classList.add('u-gray');
      else if(r<1400)pill.classList.add('u-green');
      else if(r<1600)pill.classList.add('u-cyan');
      else if(r<1900)pill.classList.add('u-blue');
      else if(r<2100)pill.classList.add('u-violet');
      else if(r<2400)pill.classList.add('u-orange');
      else pill.classList.add('u-red');
      document.getElementById('profile-link').href=`https://codeforces.com/profile/${handle}`;
      document.getElementById('user-info-row').style.display='flex';
      updateSolvedBadge();

async function fetchContests(){
  try{
    const res=await fetch('https://codeforces.com/api/contest.list');
    const data=await res.json();
    if (data.status==='OK'){
      state.allContests=data.result.filter(c=>c.phase==='FINISHED').sort((a,b)=>b.id-a.id);
      lsSet('cf_cache_contests',state.allContests);
      applyFilters();
    }
  }catch(e){console.error('fetchContests',e)}
}

function applyFilters(){
  const onlyStd    =document.getElementById('roundFilter').checked;
  const onlyAtt    =document.getElementById('attemptedFilter').checked;
  const onlyUnsolved=document.getElementById('unsolvedFilter').checked;
  const div        =document.getElementById('divFilter').value;
  const rMin       =parseInt(document.getElementById('ratingMin').value)||0;
  const rMax       =parseInt(document.getElementById('ratingMax').value)||9999;
  const hasTags    =state.activeTags.size>0;

  state.filteredContests = state.allContests.filter(c=>{
    const n=c.name;
    if (onlyStd&&!((n.includes('Codeforces Round')||n.includes('Educational'))&&!n.includes('Hello')&&!n.includes('Good Bye')&&!n.includes('ICPC'))) return false;
    if (onlyAtt&&!state.attemptedContests.has(c.id)) return false;
    if (div!=='ALL'&&!n.includes(div)) return false;
    // For rating/tag filters: include contest if it has at least one matching problem
    if ((rMin>0||rMax<9999||hasTags)&&state.problemsReady){
      const probs=state.problemsByContest.get(c.id)||[];
      const match=probs.some(p=>{
        const r=p.rating||0;
        const rOk=(r===0)||(r>=rMin&&r<=rMax);
        const tOk=!hasTags||[...state.activeTags].every(t=>(p.tags||[]).includes(t));
        return rOk&&tOk;
      });
      if (!match) return false;
    }
    if (onlyUnsolved&&state.problemsReady){
      const probs=state.problemsByContest.get(c.id)||[];
      const hasUnsolved=probs.some(p=>!state.solved.has(`${c.id}${p.index}`));
      if (!hasUnsolved) return false;
    }
    return true;
  });
  document.querySelectorAll('.contest-card').forEach(e=>e.remove());
  state.renderedCount=0;
  renderNextBatch();
}

function clearAllFilters(){
  document.getElementById('roundFilter').checked=true;
  document.getElementById('attemptedFilter').checked=false;
  document.getElementById('unsolvedFilter').checked=false;
  document.getElementById('divFilter').value='ALL';
  document.getElementById('ratingMin').value='';
  document.getElementById('ratingMax').value='';
  state.activeTags.clear();
  renderTagFilterBar();
  const row=document.getElementById('tag-filter-row');
  if (row.style.display==='flex'){toggleTagFilter()}
  applyFilters();
}

function renderNextBatch(){
  const list=document.getElementById('contest-list');
  const batch=state.filteredContests.slice(state.renderedCount,state.renderedCount+20);
  batch.forEach(c=>{
    const card=document.createElement('div');
    card.className='contest-card'; card.dataset.cid=c.id;
    const probs=state.problemsByContest.get(c.id)||[];
    let hStyle='', badge='';
    if (state.attemptedContests.has(c.id)&&probs.length>0){
      const solved=probs.filter(p=>state.solved.has(`${c.id}${p.index}`)).length;
      const pct=Math.min(100,Math.round((solved/probs.length)*100));
      hStyle=`style="background:linear-gradient(90deg,var(--progress-fill) ${pct}%,var(--progress-bg) ${pct}%)"`;
      badge=`<span class="solved-badge">${solved}/${probs.length}</span>`;
    }
    card.innerHTML=`<div class="contest-header" onclick="toggleContest(this,${c.id})" ${hStyle}>
      <span style="font-weight:500;font-size:0.88rem">${c.name}</span>
      <div class="contest-meta">${badge}<span class="cid-tag">#${c.id}</span></div>
    </div><div class="contest-body" data-loaded="false"></div>`;
    list.insertBefore(card,document.getElementById('sentinel'));
  });
  state.renderedCount+=20;
}

function toggleContest(header,cid){
  const card=header.parentElement, body=card.querySelector('.contest-body');
  if (!card.classList.toggle('open')) return;
  if (body.dataset.loaded==='true') return;
  renderContestBody(body,cid);
}

function renderContestBody(body,cid){
  if (!state.problemsReady){
    body.innerHTML='<div style="padding:10px;text-align:center;color:var(--text-secondary)">Loading problems…</div>';
    return;
  }
  const rMin=parseInt(document.getElementById('ratingMin').value)||0;
  const rMax=parseInt(document.getElementById('ratingMax').value)||9999;
  const hasTags=state.activeTags.size>0;
  const onlyUnsolved=document.getElementById('unsolvedFilter').checked;

  let probs=(state.problemsByContest.get(cid)||[]).filter(p=>{
    const r=p.rating||0;
    const rOk=(rMin===0&&rMax===9999)||(r===0)||(r>=rMin&&r<=rMax);
    const tOk=!hasTags||[...state.activeTags].every(t=>(p.tags||[]).includes(t));
    const uOk=!onlyUnsolved||!state.solved.has(`${cid}${p.index}`);
    return rOk&&tOk&&uOk;
  });

  if (!probs.length){
    body.innerHTML=`<div style="padding:12px;color:var(--text-secondary);font-size:0.83rem">No matching problems.</div>`;
    body.dataset.loaded='true'; return;
  }
  body.innerHTML=probs.map(p=>createProblemHTML(p,cid)).join('');
  body.dataset.loaded='true';
  // update header progress bar
  const allProbs=state.problemsByContest.get(cid)||[];
  if (allProbs.length&&state.attemptedContests.has(cid)){
    const s=allProbs.filter(p=>state.solved.has(`${cid}${p.index}`)).length;
    const pct=Math.min(100,Math.round((s/allProbs.length)*100));
    body.previousElementSibling.style.background=
      `linear-gradient(90deg,var(--progress-fill) ${pct}%,var(--progress-bg) ${pct}%)`;
  }
}

function createProblemHTML(p,cid){
  const pid=`${cid}${p.index}`;
  const isSolved=state.solved.has(pid);
  const isAttempted=state.attempted.has(pid);
  const isBookmarked=state.bookmarks.has(pid);
  const hasNote=lsRaw(`cf_note_${pid}`)||lsRaw(`cf_note_${pid}_cpp`)
    ||lsRaw(`cf_note_${pid}_python`)||lsRaw(`cf_note_${pid}_java`)?'has-note':'';
  const rHtml=p.rating?`<span class="topic-pill rating-pill">${p.rating}</span>`:'';
  const tHtml=(p.tags||[]).map(t=>

  ).join('');
  const statusIcon=isSolved?'✅':isAttempted?'⚡':'';
  const rowClass=`problem-row${isSolved?' solved':isAttempted?' attempted':''}`;
  const cleanName=p.name.replace(/'/g,'').replace(/"/g,'');
  return `<div class="${rowClass}" id="row-${pid}">
    <div class="p-status">${statusIcon}</div>

      <button class="icon-btn${hasNote?' has-note':''}" title="Notes / Editor"
        onclick="openEditor('${pid}',${cid},'${p.index}','${cleanName}')">✎</button>
      <a href="https://codeforces.com/contest/${cid}/problem/${p.index}"
         target="_blank" class="icon-btn" title="Open on CF">↗</a>
    </div>
  </div>`;
}

async function searchProblem(){
  const q=document.getElementById('problemSearch').value.trim().toUpperCase();
  if (!q) return;
  const m=q.match(/^(\d+)([A-Z]\d*)$/);
  if (!m){alert('Format: 4A or 1600B');return}
  const cid=+m[1], idx=m[2], pid=`${cid}${idx}`;
  const contest=state.allContests.find(c=>c.id===cid);
  if (!contest){alert(`Contest ${cid} not found`);return}

  // Switch to contests view if in bookmarks
  if (state.viewMode==='bookmarks') toggleBookmarksView();

  state.filteredContests=[contest];
  document.querySelectorAll('.contest-card').forEach(e=>e.remove());
  state.renderedCount=0;
  const list=document.getElementById('contest-list');
  const card=document.createElement('div');
  card.className='contest-card'; card.dataset.cid=cid;
  card.innerHTML=`<div class="contest-header" onclick="toggleContest(this,${cid})">
    <span style="font-weight:500">${contest.name}</span>
    <div class="contest-meta"><span class="cid-tag">#${cid}</span></div>
  </div><div class="contest-body" data-loaded="false"></div>`;
  list.appendChild(card);
  toggleContest(card.querySelector('.contest-header'),cid);

  // Wait for problems to render then scroll
  const scroll=()=>{
    const row=document.getElementById(`row-${pid}`);
    if (row){
      row.scrollIntoView({behavior:'smooth',block:'center'});
      row.classList.add('highlight-row');
      setTimeout(()=>row.classList.remove('highlight-row'),2500);
    } else {
      alert(`Problem ${idx} not found in contest ${cid}\n(May not be in problemset API)`);
    }
  };
  setTimeout(scroll, state.problemsReady?200:1200);
}

function toggleBookmark(pid,cid,idx,name,rating,tags){

  else state.bookmarks.set(pid,{cid,idx,name,rating,tags:tags?tags.split(','):[]});

  const row=document.getElementById(`row-${pid}`);

function switchTab(tab){
  state.currentTab=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(`tab-${tab}`).classList.add('active');
  document.getElementById('view-sub-btn').style.display=tab==='solution'?'block':'none';
  document.getElementById('lang-select').style.display=tab==='notes'?'':'none';

  if (tab==='notes'){
    editor.setOption('readOnly',false);
    const lang=state.currentLang;
    const key=lang==='cpp'?`cf_note_${state.activeProblem.id}`:`cf_note_${state.activeProblem.id}_${lang}`;
    // Suppress change-handler during programmatic setValue so we don't
    // accidentally overwrite cloud content with local/template before fetch returns
    state._noteChangedByUser = false;
    editor.setValue(lsRaw(key)||LANG_TEMPLATES[lang]);
    editor.setOption('mode',LANG_MODE[lang]);
    document.getElementById('save-indicator').innerText='Notes';
    // Small delay then re-enable user-change tracking
    setTimeout(()=>{ state._noteChangedByUser = true; }, 100);
  } else {
    editor.setOption('readOnly',true);
    editor.setOption('mode','text/x-c++src');
    editor.setValue('// Loading your AC solution…');
    const subId=state.submissionMap.get(state.activeProblem.id);
    if (subId) fetchSolutionCode(state.activeProblem.cid,subId);
    else editor.setValue('// No accepted solution found for this problem.\n// Sync your handle first, or you may not have solved this yet.');
  }
  setTimeout(()=>editor.refresh(),50);
}

// Solution viewer — fetch source directly via CF API (no proxy needed).
// CF's contest.status endpoint returns submissions including source code
// when the handle is known. We look up the specific submission by ID.
async function fetchSolutionCode(cid, subId){
  const handle = localStorage.getItem('cf_handle');
  if (!handle) {
    editor.setValue('// Set your CF handle and sync first so we can fetch your solution.');
    return;
  }
  editor.setValue('// Fetching from CF API…');
  try {
    // Fetch up to 100 submissions for this contest by handle, find our subId
    const res = await fetch(
      `https://codeforces.com/api/contest.status?contestId=${cid}&handle=${encodeURIComponent(handle)}&from=1&count=100`
    );
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (data.status !== 'OK') throw new Error(data.comment || 'CF API error');
    const sub = data.result.find(s => s.id === subId);
    if (sub && sub.programmingLanguage) {
      // CF API returns source code in newer API versions for your own submissions
      // The source field may or may not be present depending on CF's API version
      if (sub.source) {
        editor.setValue(sub.source);
        document.getElementById('save-indicator').innerText = 'Solution Loaded ✓';
        return;
      }
    }
    // Fallback: tell user to open on CF, provide direct link
    editor.setValue(
      `// CF API doesn't expose source code directly.\n` +
      `// Click "↗ CF" button above to view submission #${subId} on Codeforces.\n\n` +
      `// Submission ID: ${subId}\n` +
      `// Contest: ${cid}\n` +
      `// Direct link: https://codeforces.com/contest/${cid}/submission/${subId}`
    );
    document.getElementById('save-indicator').innerText = 'Open on CF ↗';
  } catch(e) {
    editor.setValue(
      `// Could not fetch solution: ${e.message}\n` +
      `// Click "↗ CF" above to view it on Codeforces.\n` +
      `// Submission #${subId}`
    );
  }
}

function openExternalSub(){
  const subId=state.submissionMap.get(state.activeProblem.id);
  if (subId) window.open(`https://codeforces.com/contest/${state.activeProblem.cid}/submission/${subId}`,'_blank');
  else alert('No submission ID. Please sync your handle.');
}

async function openEditor(pid,cid,idx,name){
  state.activeProblem={id:pid,cid,idx,name};
  document.getElementById('empty-state').style.display='none';
  document.getElementById('stats-panel').style.display='none';
  document.getElementById('editor-container').style.display='flex';
  // Title with CF link
  document.getElementById('active-title').innerHTML=
    `<a href="https://codeforces.com/contest/${cid}/problem/${idx}" target="_blank">${idx}. ${name}</a>`;
  document.getElementById('lang-select').value=state.currentLang;
  switchTab('notes');
  // Load from cloud if logged in — do this after a tick so switchTab's
  // suppression window has elapsed and we can set a new one for cloud load
  if (state.user){
    setTimeout(()=>{
      db.collection('users').doc(state.user.uid).collection('notes').doc(pid).get()
        .then(doc=>{
          if (doc.exists && state.currentTab==='notes' && state.activeProblem?.id===pid){
            const cloud=doc.data().content;
            if (cloud && cloud!==editor.getValue()){
              state._noteChangedByUser = false;
              editor.setValue(cloud);
              const lang=state.currentLang;
              const key=lang==='cpp'?`cf_note_${pid}`:`cf_note_${pid}_${lang}`;
              lsRawSet(key, cloud); // persist cloud copy locally
              document.getElementById('save-indicator').innerText='Loaded from cloud ☁';
              setTimeout(()=>{ state._noteChangedByUser=true; },100);
            }
          }
        }).catch(e=>console.error('note fetch',e));
    }, 150);
  }
  setTimeout(()=>editor.refresh(),50);
}

editor.on('change',()=>{
  if (!state.activeProblem||state.currentTab!=='notes') return;
  if (!state._noteChangedByUser) return; // programmatic setValue, not a user edit
  const content=editor.getValue(), pid=state.activeProblem.id, lang=state.currentLang;
  const key=lang==='cpp'?`cf_note_${pid}`:`cf_note_${pid}_${lang}`;
  lsRawSet(key,content);
  document.getElementById('save-indicator').innerText='Saving…';
  clearTimeout(saveTimeout);
  saveTimeout=setTimeout(()=>{
    if (state.user){
      db.collection('users').doc(state.user.uid).collection('notes').doc(pid)
        .set({content,lang},{merge:true})
        .then(()=>document.getElementById('save-indicator').innerText='Saved ☁')
        .catch(()=>document.getElementById('save-indicator').innerText='Save Failed');
    } else {
      document.getElementById('save-indicator').innerText='Saved (local)';
    }
  },900);
});

function closeEditor(){
  state.activeProblem=null;
  document.getElementById('editor-container').style.display='none';
  document.getElementById('empty-state').style.display='flex';
}
function copyCode(){navigator.clipboard.writeText(editor.getValue()).then(()=>{
  const btn=event.target; btn.innerText='Copied!'; setTimeout(()=>btn.innerText='Copy',1500);
})}
function submitToCF(){
  if (!state.activeProblem) return;
  copyCode();
  const lang=LANG_CF[state.currentLang]||'GNU G++20 13.2 (64 bit)';
  window.open(`https://codeforces.com/contest/${state.activeProblem.cid}/submit?programTypeId=89&problemIndex=${state.activeProblem.idx}`,'_blank');
}

// ═══════════════════════════════════════════════════════
// STATS PANEL
// ═══════════════════════════════════════════════════════
function toggleStatsPanel(){
  state.statsOpen=!state.statsOpen;
  const panel=document.getElementById('stats-panel');
  const empty=document.getElementById('empty-state');
  const ed=document.getElementById('editor-container');
  if (state.statsOpen){
    ed.style.display='none'; empty.style.display='none';
    panel.style.display='flex'; panel.style.flexDirection='column';
    renderStats();
  } else {
    panel.style.display='none';
    if (state.activeProblem) ed.style.display='flex';
    else empty.style.display='flex';
  }
}

function renderStats(){
  const solved=state.solved.size;
  const attempted=state.attempted.size;
  const contests=[...new Set([...state.solved].map(pid=>{
    const m=pid.match(/^(\d+)/); return m?m[1]:null;
  }).filter(Boolean))].length;

  document.getElementById('stats-grid').innerHTML=`
    <div class="stat-card"><div class="stat-num" style="color:var(--success)">${solved}</div><div class="stat-label">Problems Solved</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--gold)">${attempted}</div><div class="stat-label">Attempted</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--accent)">${contests}</div><div class="stat-label">Contests</div></div>
  `;

  // Solved by rating bucket
  const buckets=[800,900,1000,1100,1200,1300,1400,1500,1600,1700,1800,1900,2000,2100,2200,2300,2400,2500,2600,2700,2800,2900,3000,3100,3200,3300,3400,3500];
  const counts={};
  buckets.forEach(b=>counts[b]=0);
  for (const pid of state.solved){
    // find problem rating from allProblems
    const cid=+pid.match(/^(\d+)/)[1], idx=pid.slice(String(cid).length);
    const probs=state.problemsByContest.get(cid)||[];
    const p=probs.find(x=>x.index===idx);
    if (p&&p.rating){
      const b=Math.floor(p.rating/100)*100;
      if (counts[b]!==undefined) counts[b]++;
      else counts[b]=(counts[b]||0)+1;
    }
  }
  // Group into ranges of 200
  const groups=[[800,999],[1000,1199],[1200,1399],[1400,1599],[1600,1799],[1800,1999],[2000,2199],[2200,2399],[2400,2599],[2600,2999],[3000,3500]];
  const maxVal=Math.max(1,...Object.values(counts));
  let barsHtml=groups.map(([lo,hi])=>{
    let c=0; for (let r=lo;r<=hi;r+=100) c+=(counts[r]||0);
    const pct=Math.round((c/maxVal)*100);
    const color=lo<1200?'#808080':lo<1400?'#008000':lo<1600?'#03a89e':lo<1900?'#0000ff':lo<2100?'#aa00aa':lo<2400?'#ff8c00':'#ff0000';
    return `<div class="bar-row">
      <div class="bar-label">${lo}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
      <div class="bar-count">${c}</div>
    </div>`;
  }).join('');
  document.getElementById('rating-bars').innerHTML=`<h3>Solved by Rating</h3>${barsHtml}`;
}

// ═══════════════════════════════════════════════════════
// RANDOM PROBLEM PICKER
// ═══════════════════════════════════════════════════════
function openRandomModal(){document.getElementById('random-modal').classList.add('show')}
function closeRandomModal(){document.getElementById('random-modal').classList.remove('show')}

function pickRandom(){
  if (!state.problemsReady){document.getElementById('rand-result').innerText='Problems still loading…';return}
  const mn=parseInt(document.getElementById('rand-min').value)||800;
  const mx=parseInt(document.getElementById('rand-max').value)||1600;
  const onlyUnsolved=document.getElementById('rand-unsolved').checked;
  let pool=state.allProblems.filter(p=>{
    if (!p.rating||p.rating<mn||p.rating>mx) return false;
    if (onlyUnsolved&&state.solved.has(`${p.contestId}${p.index}`)) return false;
    return true;
  });
  if (!pool.length){
    document.getElementById('rand-result').innerHTML='<span style="color:var(--danger)">No problems found with these criteria.</span>';
    return;
  }
  const p=pool[Math.floor(Math.random()*pool.length)];
  const pid=`${p.contestId}${p.index}`;
  const solved=state.solved.has(pid);
  document.getElementById('rand-result').innerHTML=
    `<div style="display:flex;flex-direction:column;gap:4px;width:100%">
      <a href="https://codeforces.com/contest/${p.contestId}/problem/${p.index}" target="_blank">
        ${p.index}. ${p.name}
      </a>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <span class="topic-pill rating-pill">${p.rating}</span>
        ${(p.tags||[]).map(t=>`<span class="topic-pill">${t}</span>`).join('')}
        ${solved?'<span style="color:var(--success)">✅ Solved</span>':''}
      </div>
    </div>`;
}

// close modal on backdrop click
document.getElementById('random-modal').addEventListener('click',e=>{
  if (e.target===document.getElementById('random-modal')) closeRandomModal();
});

// ═══════════════════════════════════════════════════════
// THEME
// ═══════════════════════════════════════════════════════
function toggleTheme(){
  const next=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('cf_theme',next);
  editor.setOption('theme',next==='dark'?'ayu-mirage':'eclipse');
}

// ═══════════════════════════════════════════════════════
// RESIZER
// ═══════════════════════════════════════════════════════
function initResizer(){
  const r=document.getElementById('resizer'), s=document.getElementById('sidebar');
  let on=false;
  r.addEventListener('mousedown',()=>{on=true;document.body.style.cursor='col-resize'});
  document.addEventListener('mousemove',e=>{if(on)s.style.width=Math.max(300,Math.min(800,e.clientX))+'px'});
  document.addEventListener('mouseup',()=>{on=false;document.body.style.cursor='default'});
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
async function init(){
  const theme=localStorage.getItem('cf_theme')||'dark';
  document.documentElement.setAttribute('data-theme',theme);
  editor.setOption('theme',theme==='dark'?'ayu-mirage':'eclipse');

  if (state.allContests.length>0) applyFilters();

  // Kick off both in parallel
  fetchAllProblems();
  fetchContests();

  auth.onAuthStateChanged(async u=>{
    state.user=u; updateAuthUI();
    if (u){
      await loadUserData(u.uid);
      document.getElementById('cloud-status').innerText='☁️ Cloud sync active';
    } else {
      // Bookmarks already loaded from localStorage in state initialisation — no-op needed.
      document.getElementById('cloud-status').innerText='⚠️ Guest mode — login to sync across devices';
    }
  });

  const h=localStorage.getItem('cf_handle');
  if (h){document.getElementById('handleInput').value=h; fetchUserInfo(h);}

  const obs=new IntersectionObserver(e=>{
    if (e[0].isIntersecting&&state.viewMode==='contests') renderNextBatch();
  },{rootMargin:'200px'});
  obs.observe(document.getElementById('sentinel'));

  initResizer();
}

init();
</script>
