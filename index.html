<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CF Tracker Pro v33 (Cloud Compiler)</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/ayu-mirage.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/eclipse.min.css">
    
    <script>
        window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/edit/closebrackets.min.js"></script>

    <style>
        :root[data-theme="dark"] {
            --bg-main: #0d1117; --bg-sidebar: #161b22; --bg-card: #21262d;
            --bg-hover: #30363d; --border: #30363d; --text-primary: #c9d1d9;
            --text-secondary: #8b949e; --accent: #58a6ff; --success: #238636;
            --danger: #f85149; --gold: #e3b341; --vscode: #007acc; --tag-bg: #1f2428;
            --progress-fill: rgba(35, 134, 54, 0.4); --progress-bg: #21262d;
            --tab-active-bg: #1f2428; --tab-inactive-bg: #161b22;
            --highlight: rgba(210, 153, 34, 0.3);
        }
        :root[data-theme="light"] {
            --bg-main: #ffffff; --bg-sidebar: #f6f8fa; --bg-card: #ffffff;
            --bg-hover: #eaeef2; --border: #d0d7de; --text-primary: #24292f;
            --text-secondary: #57606a; --accent: #0969da; --success: #1a7f37;
            --danger: #cf222e; --gold: #d29922; --tag-bg: #eff1f3;
            --progress-fill: rgba(26, 127, 55, 0.25); --progress-bg: #ffffff;
            --tab-active-bg: #ffffff; --tab-inactive-bg: #f6f8fa;
            --highlight: rgba(210, 153, 34, 0.3);
        }

        * { box-sizing: border-box; outline: none; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-main); color: var(--text-primary); display: flex; height: 100vh; overflow: hidden; }

        #sidebar { width: 450px; background: var(--bg-sidebar); display: flex; flex-direction: column; flex-shrink: 0; border-right: 1px solid var(--border); position: absolute; left: 0; top: 0; bottom: 0; z-index: 100; transition: transform 0.3s ease; }
        #sidebar.collapsed { transform: translateX(-100%); }

        .header-panel { padding: 10px; border-bottom: 1px solid var(--border); background: var(--bg-sidebar); display: flex; flex-direction: column; gap: 8px; }
        .top-row { display: flex; justify-content: space-between; align-items: center; height: 28px; }
        .brand { font-weight: 700; font-size: 1rem; display: flex; align-items: center; gap: 6px; }
        .top-actions { display: flex; align-items: center; gap: 5px; }
        #user-avatar { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--border); display: none; }
        
        .control-row { display: flex; gap: 6px; height: 32px; }
        input[type="text"] { background: var(--bg-main); border: 1px solid var(--border); color: var(--text-primary); padding: 4px 10px; border-radius: 6px; flex: 1; font-size: 0.9rem; }
        #problemSearch { border-color: var(--border); }
        #problemSearch:focus { border-color: var(--gold); }

        #user-info-row { display: none; align-items: center; gap: 8px; font-size: 0.8rem; margin-top: -4px; margin-bottom: 2px; }
        #rating-pill { padding: 1px 6px; border-radius: 4px; font-weight: bold; font-size: 0.75rem; }
        .u-gray { background-color: #808080; color: white; }
        .u-green { background-color: #008000; color: white; }
        .u-cyan { background-color: #03a89e; color: white; }
        .u-blue { background-color: #0000ff; color: white; }
        .u-violet { background-color: #aa00aa; color: white; }
        .u-orange { background-color: #ff8c00; color: white; }
        .u-red { background-color: #ff0000; color: white; }
        #profile-link { text-decoration: none; color: var(--text-secondary); display: flex; align-items: center; gap: 3px; }
        
        .filter-row { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--text-secondary); margin-top: 2px; flex-wrap: wrap; }
        #divFilter { background: var(--bg-main); color: var(--text-primary); border: 1px solid var(--border); border-radius: 4px; padding: 2px 4px; font-size: 0.8rem; cursor: pointer; height: 24px; }
        .filter-item { display: flex; align-items: center; gap: 5px; cursor: pointer; }
        
        .btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); padding: 0 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn:hover { background: var(--bg-hover); }
        .btn-primary { background: var(--success); border-color: var(--success); color: white; }
        .btn-run { background: var(--success); color: white; border-color: var(--success); min-width: 120px; }
        .btn-run:disabled { background: #555; border-color: #555; cursor: wait; }
        .btn-sm { font-size: 0.75rem; padding: 2px 10px; height: 24px; }

        #bg-stats { font-size: 0.75rem; color: var(--accent); margin-top: 2px; height: 14px; white-space: nowrap; overflow: hidden; }

        #contest-list, #bookmark-list { flex: 1; overflow-y: auto; padding: 10px; scroll-behavior: smooth; }
        #bookmark-list { display: none; }
        .contest-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; overflow: hidden; }
        .contest-header { padding: 10px 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: var(--progress-bg); transition: background 0.5s ease; }
        .contest-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; border-top: 1px solid transparent; background: var(--bg-card); }
        .contest-card.open .contest-body { max-height: 5000px; border-top-color: var(--border); }

        .problem-row { display: grid; grid-template-columns: 24px 35px 1fr 60px; align-items: start; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--bg-sidebar); gap: 8px; transition: background 0.5s; cursor: pointer; }
        .problem-row:hover { background: var(--bg-hover); }
        .problem-row.solved { border-left: 3px solid var(--success); background: rgba(35, 134, 54, 0.08); }
        .problem-row.highlight-row { animation: flashHighlight 2s ease-out; border-left: 3px solid var(--gold); }
        @keyframes flashHighlight { 0% { background: var(--highlight); } 100% { background: var(--bg-sidebar); } }

        .p-status { text-align: center; padding-top: 2px; }
        .p-index { font-weight: bold; color: var(--accent); padding-top: 2px; }
        .p-content { display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
        .p-name { font-weight: 500; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .topic-list { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; flex-wrap: wrap; }
        .topic-pill { font-size: 0.75rem; background: var(--tag-bg); color: var(--text-secondary); padding: 1px 7px; border-radius: 12px; white-space: nowrap; border: 1px solid var(--border); }
        .topic-pill.rating-pill { color: #d19a66; border-color: #d19a66; font-weight: 700; }
        [data-theme="light"] .topic-pill.rating-pill { color: #b07d47; border-color: #b07d47; }
        .p-actions { display: flex; gap: 4px; justify-content: flex-end; }
        .icon-btn { background: transparent; border: 1px solid transparent; cursor: pointer; font-size: 1rem; padding: 2px 5px; opacity: 0.6; transition: 0.2s; border-radius: 4px; }
        .icon-btn:hover { opacity: 1; background: var(--bg-hover); border-color: var(--border); }
        .icon-btn.starred { color: var(--gold); opacity: 1; }
        .icon-btn.has-note { color: var(--accent); opacity: 1; }

        /* --- MAIN WORKSPACE --- */
        #workspace { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); width: 100vw; margin-left: 0; transition: margin-left 0.3s; }
        
        #nav-bar { height: 40px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 10px; background: var(--bg-sidebar); justify-content: space-between; }
        #menu-btn { font-size: 1.2rem; cursor: pointer; background: none; border: none; color: var(--text-primary); margin-right: 10px; }
        #active-problem-name { font-weight: bold; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #split-container { flex: 1; display: flex; height: calc(100vh - 40px); overflow: hidden; position: relative; }
        
        #pane-left { width: 50%; display: flex; flex-direction: column; border-right: 1px solid var(--border); }
        .CodeMirror { flex: 1; font-family: 'Fira Code', monospace; font-size: 14px; }
        
        #resizer-vertical { width: 5px; background: var(--bg-sidebar); cursor: col-resize; z-index: 10; border-left: 1px solid var(--border); }
        #resizer-vertical:hover { background: var(--accent); }

        #pane-right { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); overflow: hidden; }
        
        .tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--bg-sidebar); }
        .tab { padding: 8px 16px; cursor: pointer; font-size: 0.85rem; border-right: 1px solid var(--border); opacity: 0.7; }
        .tab.active { background: var(--bg-main); opacity: 1; font-weight: bold; border-top: 2px solid var(--accent); }
        
        #preview-content, #terminal-content { flex: 1; overflow-y: auto; padding: 20px; display: none; }
        #preview-content.active, #terminal-content.active { display: block; }
        
        #preview-content { font-size: 0.95rem; line-height: 1.6; color: var(--text-primary); }
        #preview-content img { max-width: 100%; display: block; margin: 10px 0; }
        #preview-content .title { font-size: 1.3rem; font-weight: bold; margin-bottom: 10px; color: var(--accent); }
        #preview-content .header { margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        #preview-content pre { background: var(--bg-sidebar); padding: 12px; border-radius: 6px; border: 1px solid var(--border); font-family: 'Fira Code', monospace; white-space: pre-wrap; word-wrap: break-word; }

        /* Terminal Grid */
        .terminal-grid { display: grid; grid-template-rows: 1fr 1fr; gap: 10px; height: 100%; }
        .io-box { display: flex; flex-direction: column; gap: 5px; height: 100%; }
        .io-label { font-size: 0.75rem; color: var(--text-secondary); font-weight: bold; }
        textarea.io-area { 
            flex: 1; background: var(--bg-sidebar); border: 1px solid var(--border); 
            color: var(--text-primary); font-family: 'Fira Code', monospace; padding: 10px; resize: none; 
        }
        
        #empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-secondary); position: absolute; top:0; left:0; right:0; bottom:0; z-index: 50; background: var(--bg-main); }
        #ide-container { display: none; flex-direction: column; height: 100%; width: 100%; }
        #cloud-loader { height: 2px; background: linear-gradient(90deg, var(--accent), var(--success)); width: 0%; position: absolute; top: 0; left: 0; z-index: 200; transition: 0.3s; }
        
        /* Spinner */
        .spinner { border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 2px solid white; width: 12px; height: 12px; animation: spin 1s linear infinite; display: none; margin-right: 5px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header-panel">
            <div class="top-row">
                <div class="brand">⚡ CF Tracker Pro</div>
                <div class="top-actions">
                    <img id="user-avatar" src="" title="Logged In">
                    <button class="btn btn-sm" id="authBtn" onclick="handleAuth()">Login</button>
                    <button class="btn btn-sm" onclick="toggleTheme()" title="Theme">🌙</button>
                </div>
            </div>
            
            <div class="control-row">
                <input type="text" id="handleInput" placeholder="Handle" onchange="syncUser()">
                <button class="btn btn-primary" id="syncBtn" onclick="syncUser()" title="Sync">↻</button>
                <button class="btn" id="bmBtn" onclick="toggleBookmarksView()" title="Bookmarks">★</button>
            </div>

            <div id="user-info-row">
                <span id="rating-pill"></span>
                <a id="profile-link" href="#" target="_blank">↗ Profile</a>
            </div>

            <div class="control-row" style="margin-top:2px;">
                <input type="text" id="problemSearch" placeholder="Search (e.g. 4A, 1600B)" onkeyup="if(event.key === 'Enter') searchProblem()">
            </div>

            <div class="filter-row">
                <select id="divFilter" onchange="applyFilters()">
                    <option value="ALL">All Divs</option>
                    <option value="Div. 1">Div 1</option>
                    <option value="Div. 2">Div 2</option>
                    <option value="Div. 3">Div 3</option>
                    <option value="Div. 4">Div 4</option>
                    <option value="Educational">Educational</option>
                    <option value="Global">Global</option>
                </select>
                <label class="filter-item"><input type="checkbox" id="roundFilter" checked onchange="applyFilters()"> Std.</label>
                <label class="filter-item" style="color:var(--accent);"><input type="checkbox" id="attemptedFilter" onchange="applyFilters()"> Attempted</label>
            </div>
            <div id="bg-stats"></div>
        </div>
        <div id="contest-list"><div id="sentinel" style="height: 20px;"></div></div>
        <div id="bookmark-list"></div>
    </div>

    <div id="workspace">
        <div id="cloud-loader"></div>
        
        <div id="empty-state">
            <h2>Select a Problem</h2>
            <p id="cloud-status" style="margin-top:10px; font-size:0.9rem;">☁️ Login to sync</p>
        </div>

        <div id="ide-container">
            <div id="nav-bar">
                <div style="display:flex; align-items:center;">
                    <button id="menu-btn" onclick="toggleSidebar()" title="Toggle Contest List">☰</button>
                    <span id="active-problem-name">Problem Name</span>
                </div>
                <div style="display:flex; align-items:center; gap:10px;">
                    <span id="save-status" style="font-size:0.75rem; color:gray;"></span>
                    <button class="btn" onclick="openProblemInNewTab()">↗ Open in CF</button>
                    <button class="btn" onclick="copyCode()">Copy</button>
                    <button class="btn btn-primary" onclick="submitToCF()">Submit Code</button>
                </div>
            </div>

            <div id="split-container">
                <div id="pane-left">
                    <div class="editor-header">
                        <div class="editor-tabs">
                            <div class="tab-btn active" id="tab-notes" onclick="switchTab('notes')">Code</div>
                            <div class="tab-btn" id="tab-solution" onclick="switchTab('solution')">My Sub</div>
                        </div>
                    </div>
                    <textarea id="code-editor"></textarea>
                </div>

                <div id="resizer-vertical"></div>

                <div id="pane-right">
                    <div class="tabs">
                        <div class="tab active" onclick="setRightTab('preview')">Problem Statement</div>
                        <div class="tab" onclick="setRightTab('terminal')">Terminal</div>
                    </div>
                    
                    <div id="preview-content" class="active">
                        <div style="text-align:center; padding:20px; color:gray;">Loading description...</div>
                    </div>

                    <div id="terminal-content">
                        <div class="terminal-grid">
                            <div class="io-box">
                                <span class="io-label">INPUT</span>
                                <textarea id="term-input" class="io-area"></textarea>
                            </div>
                            <div class="io-box">
                                <span class="io-label">OUTPUT</span>
                                <textarea id="term-output" class="io-area" placeholder="Run code to see output..."></textarea>
                            </div>
                        </div>
                        <div style="padding:10px; border-top:1px solid var(--border); display:flex; justify-content:flex-end;">
                            <button class="btn btn-run" id="runBtn" onclick="runCode()">
                                <div class="spinner" id="runSpinner"></div>
                                <span id="runBtnText">▶ Run (Online)</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyCrNSBbljjJ0AUlGlQQtJixmEyDwGdYuZQ",
            authDomain: "cf-tracker-48be1.firebaseapp.com",
            projectId: "cf-tracker-48be1",
            storageBucket: "cf-tracker-48be1.firebasestorage.app",
            messagingSenderId: "134861845087",
            appId: "1:134861845087:web:7344ad4b9c0e9945fb61ea"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const API_CONTESTS = 'https://codeforces.com/api/contest.list';
        const API_USER = 'https://codeforces.com/api/user.status';
        const API_INFO = 'https://codeforces.com/api/user.info';

        let state = {
            allContests: JSON.parse(localStorage.getItem('cf_cache_contests') || '[]'),
            filteredContests: [], renderedCount: 0,
            solved: new Set(JSON.parse(localStorage.getItem('cf_cache_solved') || '[]')),
            attemptedContests: new Set(JSON.parse(localStorage.getItem('cf_cache_attempted_contests') || '[]')),
            submissionMap: new Map(JSON.parse(localStorage.getItem('cf_cache_submission_map') || '[]')),
            contestTotals: new Map(JSON.parse(localStorage.getItem('cf_cache_totals') || '[]')), 
            bookmarks: new Map(), activeProblem: null, user: null,
            bgFetchQueue: [], currentTab: 'notes'
        };

        const editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
            mode: "text/x-c++src", lineNumbers: true, theme: "ayu-mirage", autoCloseBrackets: true
        });

        // --- INIT ---
        async function init() {
            const theme = localStorage.getItem('cf_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            editor.setOption("theme", theme === 'dark' ? 'ayu-mirage' : 'eclipse');

            if(state.allContests.length > 0) applyFilters();
            fetchContests();

            auth.onAuthStateChanged(async (u) => {
                state.user = u;
                updateAuthUI();
                if(u) {
                    await loadUserData(u.uid);
                    document.getElementById('cloud-status').innerText = "☁️ Sync Active";
                }
            });

            const h = localStorage.getItem('cf_handle');
            if(h) {
                document.getElementById('handleInput').value = h;
                fetchUserInfo(h);
            }

            const obs = new IntersectionObserver(e => { if(e[0].isIntersecting) renderNextBatch(); }, { rootMargin: '200px' });
            obs.observe(document.getElementById('sentinel'));
            initResizer();
        }

        // --- COMPILER INTEGRATION (PISTON) ---
        async function runCode() {
            const btn = document.getElementById('runBtn');
            const btnText = document.getElementById('runBtnText');
            const spinner = document.getElementById('runSpinner');
            const output = document.getElementById('term-output');
            const source = editor.getValue();
            const stdin = document.getElementById('term-input').value;

            btn.disabled = true;
            btnText.innerText = "Compiling...";
            spinner.style.display = "inline-block";
            output.value = "Sending to server...";

            const payload = {
                language: "cpp",
                version: "10.2.0",
                files: [{ content: source }],
                stdin: stdin
            };

            try {
                const res = await fetch('https://emkc.org/api/v2/piston/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                
                let resultText = "";
                if(data.compile && data.compile.stderr) {
                    resultText += "--- COMPILATION ERROR ---\n" + data.compile.stderr + "\n";
                }
                if(data.run) {
                    if(data.run.stdout) resultText += data.run.stdout;
                    if(data.run.stderr) resultText += "\n--- RUNTIME ERROR ---\n" + data.run.stderr;
                    if(!resultText && !data.compile.stderr) resultText = "[Program finished with no output]";
                }
                output.value = resultText;
            } catch(e) {
                output.value = "Error connecting to compiler service.";
            } finally {
                btn.disabled = false;
                btnText.innerText = "▶ Run (Online)";
                spinner.style.display = "none";
            }
        }

        // --- PROBLEM LOADING & PREVIEW ---
        async function openEditor(pid, cid, index, name) {
            state.activeProblem = { id: pid, cid, index, name };
            
            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('ide-container').style.display = 'flex';
            document.getElementById('active-problem-name').innerText = `${index}. ${name}`;
            
            document.getElementById('sidebar').classList.add('collapsed');

            switchTab('notes');
            
            // Cloud Sync Check
            if(state.user) {
                db.collection('users').doc(state.user.uid).collection('notes').doc(pid).get()
                .then(doc => {
                    const code = doc.exists ? doc.data().content : (localStorage.getItem(`cf_note_${pid}`) || getDefaultTemplate(name));
                    if(state.currentTab === 'notes') editor.setValue(code);
                });
            } else {
                editor.setValue(localStorage.getItem(`cf_note_${pid}`) || getDefaultTemplate(name));
            }

            loadProblemPreview(cid, index);
            setTimeout(() => editor.refresh(), 10);
        }

        function getDefaultTemplate(name) {
            return `// ${name}\n#include <bits/stdc++.h>\nusing namespace std;\n\nvoid solve() {\n    \n}\n\nint main() {\n    ios::sync_with_stdio(0); cin.tie(0);\n    int t; cin >> t;\n    while(t--) solve();\n}`;
        }

        async function loadProblemPreview(cid, index) {
            const previewDiv = document.getElementById('preview-content');
            previewDiv.innerHTML = '<div style="padding:20px; text-align:center;">Fetching...</div>';
            
            const url = `https://codeforces.com/contest/${cid}/problem/${index}`;
            const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;

            try {
                const res = await fetch(proxy);
                const data = await res.json();
                if(!data.contents) throw new Error("No Content");

                const parser = new DOMParser();
                const doc = parser.parseFromString(data.contents, 'text/html');
                
                if(doc.title.includes("Just a moment")) throw new Error("Cloudflare");

                let statement = doc.querySelector('.problem-statement') || doc.querySelector('.ttypography');
                if(statement) {
                    statement.querySelectorAll('img').forEach(img => {
                        const src = img.getAttribute('src');
                        if(src && src.startsWith('/')) img.src = 'https://codeforces.com' + src;
                    });
                    
                    previewDiv.innerHTML = statement.innerHTML;
                    if(window.MathJax) MathJax.typesetPromise([previewDiv]);

                    const inputPre = statement.querySelector('.input pre');
                    const outputPre = statement.querySelector('.output pre');
                    if(inputPre) document.getElementById('term-input').value = inputPre.innerText;
                    if(outputPre) document.getElementById('term-output').placeholder = `Expected Output:\n${outputPre.innerText}`;
                } else { throw new Error("Parse"); }

            } catch(e) {
                previewDiv.innerHTML = `<div style="padding:20px; text-align:center; color:gray;"><h3>Load Failed</h3><button class="btn btn-primary" onclick="openProblemInNewTab()">Open in New Tab</button></div>`;
            }
        }

        // --- TABS ---
        function switchTab(tabName) {
            state.currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            
            if(tabName === 'notes') {
                editor.setOption("readOnly", false);
                const content = localStorage.getItem(`cf_note_${state.activeProblem.id}`) || getDefaultTemplate(state.activeProblem.name);
                editor.setValue(content);
                document.getElementById('save-status').innerText = "Notes";
            } else {
                editor.setOption("readOnly", true);
                editor.setValue("// Loading Solution...");
                const subId = state.submissionMap.get(state.activeProblem.id);
                if(subId) fetchSolutionCode(state.activeProblem.cid, subId);
                else editor.setValue("// No solution found. Sync required.");
            }
        }

        async function fetchSolutionCode(cid, subId) {
            const url = `https://codeforces.com/contest/${cid}/submission/${subId}`;
            try {
                const proxy = `https://corsproxy.io/?${encodeURIComponent(url)}`;
                const res = await fetch(proxy);
                const html = await res.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, "text/html");
                const code = doc.querySelector("#program-source-text");
                if(code) editor.setValue(code.innerText);
                else editor.setValue("// Could not parse code.");
            } catch(e) { editor.setValue("// Error fetching code."); }
        }

        // --- LAYOUT ---
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }
        function setRightTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`preview-content`).classList.remove('active');
            document.getElementById(`terminal-content`).classList.remove('active');
            event.target.classList.add('active');
            document.getElementById(`${tab}-content`).classList.add('active');
        }
        function initResizer() {
            const r = document.getElementById('resizer-vertical');
            const left = document.getElementById('pane-left');
            const c = document.getElementById('split-container');
            let x, w;
            r.addEventListener('mousedown', e => { x=e.clientX; w=left.getBoundingClientRect().width; document.addEventListener('mousemove', mm); document.addEventListener('mouseup', mu); });
            const mm = e => { const dx=e.clientX-x; left.style.width = `${((w+dx)/c.offsetWidth)*100}%`; };
            const mu = () => { document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); };
        }

        // --- STANDARD LOGIC (Auth, Sync, Filter) ---
        function handleAuth() { if(state.user) auth.signOut(); else auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
        function updateAuthUI() { 
            const btn = document.getElementById('authBtn'); 
            const avatar = document.getElementById('user-avatar');
            if(state.user) { btn.innerText = "Exit"; avatar.src = state.user.photoURL; avatar.style.display = 'block'; }
            else { btn.innerText = "Login"; avatar.style.display = 'none'; }
        }
        
        async function fetchContests() {
            try {
                const res = await fetch(API_CONTESTS);
                const data = await res.json();
                if(data.status === 'OK') {
                    state.allContests = data.result.filter(c => c.phase === 'FINISHED').sort((a,b) => b.id - a.id);
                    localStorage.setItem('cf_cache_contests', JSON.stringify(state.allContests));
                    applyFilters();
                }
            } catch(e) {}
        }

        function applyFilters() {
            const onlyStandard = document.getElementById('roundFilter').checked;
            const onlyAttempted = document.getElementById('attemptedFilter').checked;
            const divFilter = document.getElementById('divFilter').value;
            state.filteredContests = state.allContests.filter(c => {
                const n = c.name;
                if(onlyStandard && !((n.includes("Codeforces Round") || n.includes("Educational")) && !n.includes("Hello") && !n.includes("Good Bye") && !n.includes("ICPC"))) return false;
                if(onlyAttempted && !state.attemptedContests.has(c.id)) return false;
                if(divFilter !== "ALL" && !n.includes(divFilter)) return false;
                return true;
            });
            document.querySelectorAll('.contest-card').forEach(e => e.remove());
            state.renderedCount = 0;
            renderNextBatch();
        }

        function renderNextBatch() {
            const list = document.getElementById('contest-list');
            const batch = state.filteredContests.slice(state.renderedCount, state.renderedCount + 20);
            batch.forEach(c => {
                const card = document.createElement('div');
                card.className = 'contest-card';
                card.dataset.cid = c.id;
                let headerStyle = '';
                if (state.contestTotals.has(c.id)) {
                    let total = state.contestTotals.get(c.id);
                    let solvedCount = 0;
                    for (let s of state.solved) { if (s.startsWith(c.id)) solvedCount++; }
                    let pct = Math.min(100, Math.round((solvedCount / total) * 100));
                    headerStyle = `style="background: linear-gradient(90deg, var(--progress-fill) ${pct}%, var(--progress-bg) ${pct}%)"`;
                } 
                card.innerHTML = `<div class="contest-header" onclick="toggleContest(this, ${c.id})" ${headerStyle}><span style="font-weight:500;">${c.name}</span><span class="tag" style="background:var(--tag-bg); padding:2px 6px; border-radius:4px; font-size:0.75rem;">#${c.id}</span></div><div class="contest-body" data-loaded="false"></div>`;
                list.insertBefore(card, document.getElementById('sentinel'));
            });
            state.renderedCount += 20;
        }

        async function toggleContest(header, cid) {
            const card = header.parentElement;
            const body = card.querySelector('.contest-body');
            const cacheKey = `cf_contest_${cid}`;
            if(card.classList.toggle('open')) {
                const cached = localStorage.getItem(cacheKey);
                if(cached) {
                    renderProblemsInBody(body, JSON.parse(cached), cid);
                } else {
                    body.innerHTML = '<div style="padding:10px; text-align:center">Loading...</div>';
                    try {
                        const res = await fetch(`https://codeforces.com/api/contest.standings?contestId=${cid}&from=1&count=1`);
                        const data = await res.json();
                        if(data.status === 'OK') {
                            const problems = data.result.problems;
                            localStorage.setItem(cacheKey, JSON.stringify(problems));
                            renderProblemsInBody(body, problems, cid);
                        }
                    } catch(e) { body.innerHTML = '<div style="color:var(--danger); padding:10px">Error</div>'; }
                }
            }
        }

        function renderProblemsInBody(body, problems, cid) { 
            body.innerHTML = problems.map(p => {
                const pid = `${cid}${p.index}`;
                const isSolved = state.solved.has(pid);
                const isBookmarked = state.bookmarks.has(pid);
                const cleanName = p.name.replace(/'/g,"");
                let ratingHtml = p.rating ? `<span class="topic-pill rating-pill">${p.rating}</span>` : '';
                return `<div class="problem-row ${isSolved ? 'solved' : ''}" onclick="openEditor('${pid}', ${cid}, '${p.index}', '${cleanName}')">
                    <div class="p-status">${isSolved ? '✅' : ''}</div>
                    <div class="p-index">${p.index}</div>
                    <div class="p-content"><div class="p-name">${p.name}</div><div class="topic-list">${ratingHtml}</div></div>
                    <div class="p-actions"><button class="icon-btn ${isBookmarked ? 'starred' : ''}" onclick="event.stopPropagation(); toggleBookmark('${pid}')">★</button></div>
                </div>`;
            }).join('');
        }

        function toggleBookmark(pid) {
            if(state.bookmarks.has(pid)) state.bookmarks.delete(pid);
            else state.bookmarks.set(pid, { timestamp: Date.now() });
            localStorage.setItem('cf_bookmarks_map', JSON.stringify([...state.bookmarks]));
            // Re-render handled by toggle logic if visual update needed immediately
        }

        async function syncUser() {
            const h = document.getElementById('handleInput').value;
            localStorage.setItem('cf_handle', h);
            fetchUserInfo(h);
            const res = await fetch(`${API_USER}?handle=${h}`);
            const data = await res.json();
            if(data.status === 'OK') {
                state.solved.clear();
                state.attemptedContests.clear();
                state.submissionMap.clear();
                data.result.forEach(s => { 
                    state.attemptedContests.add(s.contestId);
                    if(s.verdict === 'OK') {
                        state.solved.add(`${s.contestId}${s.problem.index}`);
                        state.submissionMap.set(`${s.contestId}${s.problem.index}`, s.id);
                    }
                });
                localStorage.setItem('cf_cache_solved', JSON.stringify([...state.solved]));
                localStorage.setItem('cf_cache_submission_map', JSON.stringify([...state.submissionMap]));
                applyFilters();
                startBackgroundProgressFetch();
            }
        }

        async function fetchUserInfo(handle) {
            try {
                const res = await fetch(`${API_INFO}?handles=${handle}`);
                const data = await res.json();
                if(data.status === 'OK') {
                    const u = data.result[0];
                    document.getElementById('rating-pill').innerText = `${u.rank||'user'} (${u.rating||0})`;
                    document.getElementById('user-info-row').style.display='flex';
                    document.getElementById('profile-link').href=`https://codeforces.com/profile/${handle}`;
                }
            } catch(e){}
        }

        async function loadUserData(uid) {
            try {
                const doc = await db.collection('users').doc(uid).get();
                if(doc.exists) {
                    const data = doc.data();
                    if(data.cfHandle) { document.getElementById('handleInput').value = data.cfHandle; syncUser(); }
                }
            } catch(e) {}
        }

        // Background Stats Logic (Simplified)
        function startBackgroundProgressFetch() {
            state.bgFetchQueue = [...state.attemptedContests].filter(cid => !state.contestTotals.has(cid));
            if(state.bgFetchQueue.length > 0) processBackgroundQueue();
        }
        function processBackgroundQueue() {
            if(state.bgFetchQueue.length === 0) return;
            const cid = state.bgFetchQueue.shift();
            fetch(`https://codeforces.com/api/contest.standings?contestId=${cid}&from=1&count=1`)
                .then(r=>r.json()).then(d=>{
                    if(d.status==='OK') {
                        state.contestTotals.set(cid, d.result.problems.length);
                        localStorage.setItem('cf_cache_totals', JSON.stringify([...state.contestTotals]));
                        // Trigger UI update logic here if card is visible
                    }
                }).finally(()=>setTimeout(processBackgroundQueue, 800));
        }

        // Utils
        function openProblemInNewTab() { if(state.activeProblem) window.open(`https://codeforces.com/contest/${state.activeProblem.cid}/problem/${state.activeProblem.index}`, '_blank'); }
        function copyCode() { navigator.clipboard.writeText(editor.getValue()); }
        function submitToCF() { if(state.activeProblem) window.open(`https://codeforces.com/contest/${state.activeProblem.cid}/submit?problemIndex=${state.activeProblem.index}`, '_blank'); }
        function toggleTheme() { document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'); }
        function toggleBookmarksView() {
            state.viewMode = state.viewMode === 'contests' ? 'bookmarks' : 'contests';
            document.getElementById('contest-list').style.display = state.viewMode === 'contests' ? 'block' : 'none';
            document.getElementById('bookmark-list').style.display = state.viewMode === 'bookmarks' ? 'block' : 'none';
        }
        
        let saveTimeout;
        editor.on('change', () => {
            if(state.activeProblem && state.currentTab === 'notes') {
                const content = editor.getValue();
                localStorage.setItem(`cf_note_${state.activeProblem.id}`, content);
                document.getElementById('save-status').innerText = "Saving...";
                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(() => {
                    if(state.user) db.collection('users').doc(state.user.uid).collection('notes').doc(state.activeProblem.id).set({ content }, { merge: true });
                    document.getElementById('save-status').innerText = "Saved";
                }, 1000);
            }
        });

        init();
    </script>
</body>
</html>
