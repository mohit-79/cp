<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CF Tracker Pro v38 (Polished)</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/ayu-mirage.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/eclipse.min.css">
    
    <script>
        window.MathJax = { 
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            chtml: { displayAlign: 'left' } 
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/edit/closebrackets.min.js"></script>

    <style>
        :root[data-theme="dark"] {
            --bg-main: #0d1117; --bg-sidebar: #161b22; --bg-card: #21262d;
            --bg-hover: #30363d; --border: #30363d; --text-primary: #c9d1d9;
            --text-secondary: #8b949e; --accent: #58a6ff; --success: #238636;
            --danger: #f85149; --gold: #e3b341; --tag-bg: #1f2428;
            --progress-fill: rgba(35, 134, 54, 0.4); --progress-bg: #21262d;
            --tab-active: #1f2428; --tab-inactive: #0d1117;
        }
        :root[data-theme="light"] {
            --bg-main: #ffffff; --bg-sidebar: #f6f8fa; --bg-card: #ffffff;
            --bg-hover: #eaeef2; --border: #d0d7de; --text-primary: #24292f;
            --text-secondary: #57606a; --accent: #0969da; --success: #1a7f37;
            --danger: #cf222e; --gold: #d29922; --tag-bg: #eff1f3;
            --progress-fill: rgba(26, 127, 55, 0.25); --progress-bg: #ffffff;
            --tab-active: #ffffff; --tab-inactive: #f6f8fa;
        }

        * { box-sizing: border-box; outline: none; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-main); color: var(--text-primary); display: flex; height: 100vh; overflow: hidden; }

        /* --- SIDEBAR --- */
        #sidebar { width: 450px; background: var(--bg-sidebar); display: flex; flex-direction: column; flex-shrink: 0; position: absolute; left: 0; top: 0; bottom: 0; z-index: 100; transition: transform 0.3s ease; border-right: 1px solid var(--border); }
        #sidebar.collapsed { transform: translateX(-100%); }

        .header-panel { padding: 10px; border-bottom: 1px solid var(--border); background: var(--bg-sidebar); display: flex; flex-direction: column; gap: 8px; }
        .top-row { display: flex; justify-content: space-between; align-items: center; height: 28px; }
        .brand { font-weight: 700; font-size: 1rem; display: flex; align-items: center; gap: 6px; }
        .top-actions { display: flex; align-items: center; gap: 5px; }
        #user-avatar { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--border); display: none; }
        
        .control-row { display: flex; gap: 6px; height: 32px; }
        input[type="text"] { background: var(--bg-main); border: 1px solid var(--border); color: var(--text-primary); padding: 4px 10px; border-radius: 6px; flex: 1; font-size: 0.9rem; }
        
        .btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn:hover { background: var(--bg-hover); }
        .btn-primary { background: var(--success); border-color: var(--success); color: white; }
        .btn-run { background: #1f6feb; border-color: rgba(27,31,36,0.15); color: white; min-width: 90px; }
        .btn-run:disabled { opacity: 0.6; cursor: wait; }
        .btn-sm { font-size: 0.75rem; padding: 2px 10px; height: 24px; }

        .filter-row { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--text-secondary); margin-top: 2px; flex-wrap: wrap; }
        #divFilter { background: var(--bg-main); color: var(--text-primary); border: 1px solid var(--border); border-radius: 4px; padding: 2px 4px; font-size: 0.8rem; cursor: pointer; height: 24px; }
        #bg-stats { font-size: 0.75rem; color: var(--accent); margin-top: 2px; height: 14px; white-space: nowrap; overflow: hidden; }

        #contest-list { flex: 1; overflow-y: auto; padding: 10px; }
        .contest-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; overflow: hidden; }
        .contest-header { padding: 10px 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: var(--progress-bg); }
        .contest-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; border-top: 1px solid transparent; background: var(--bg-card); }
        .contest-card.open .contest-body { max-height: 5000px; border-top-color: var(--border); }

        .problem-row { display: grid; grid-template-columns: 24px 35px 1fr 60px; align-items: start; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--bg-sidebar); gap: 8px; cursor: pointer; }
        .problem-row.solved { border-left: 3px solid var(--success); background: rgba(35, 134, 54, 0.08); }
        .problem-row.highlight-row { animation: flash 2s; border-left: 3px solid var(--gold); }
        @keyframes flash { 0% { background: var(--highlight); } 100% { background: var(--bg-sidebar); } }

        /* --- PREVIEW STYLING (The Fix for Spacing) --- */
        #preview-content { 
            font-size: 15px; line-height: 1.6; color: var(--text-primary); padding: 20px; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        /* Emulate Codeforces Typography */
        #preview-content .title { font-size: 1.5rem; margin-bottom: 10px; color: var(--accent); font-weight: bold; }
        #preview-content .time-limit, #preview-content .memory-limit { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 5px; }
        #preview-content p { margin-bottom: 1.2em; text-align: justify; }
        #preview-content .section-title { font-weight: bold; font-size: 1.1rem; margin-top: 1.5em; margin-bottom: 0.5em; color: var(--text-secondary); }
        #preview-content pre { 
            background: var(--bg-sidebar); padding: 10px; border-radius: 4px; border: 1px solid var(--border); 
            font-family: 'Fira Code', monospace; white-space: pre-wrap; font-size: 0.9rem;
        }
        #preview-content ul { padding-left: 20px; margin-bottom: 1em; }
        #preview-content li { margin-bottom: 0.5em; }
        
        /* Terminal */
        .terminal-grid { display: grid; grid-template-rows: 1fr 1fr; gap: 10px; height: 100%; }
        .io-box { display: flex; flex-direction: column; gap: 5px; height: 100%; }
        textarea.io-area { flex: 1; background: var(--bg-sidebar); border: 1px solid var(--border); color: var(--text-primary); font-family: 'Fira Code', monospace; padding: 10px; resize: none; border-radius: 4px; }
        .output-container { flex: 1; background: var(--bg-sidebar); border: 1px solid var(--border); color: var(--text-primary); font-family: 'Fira Code', monospace; padding: 10px; overflow-y: auto; border-radius: 4px; white-space: pre-wrap; font-size: 0.9rem; }

        /* Output Diff Colors */
        .status-badge { padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .status-ok { background: rgba(35, 134, 54, 0.2); color: var(--success); border: 1px solid var(--success); }
        .status-err { background: rgba(248, 81, 73, 0.2); color: var(--danger); border: 1px solid var(--danger); }
        .diff-block { margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .diff-val-actual { background: var(--diff-del); padding: 5px; border-radius: 4px; color: #ffadad; margin-bottom: 5px;}
        .diff-val-expected { background: var(--diff-add); padding: 5px; border-radius: 4px; color: #b4f8c8; }

        /* IDE Layout */
        #workspace { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); width: 100vw; margin-left: 0; transition: margin-left 0.3s; }
        #nav-bar { height: 40px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 10px; background: var(--bg-sidebar); justify-content: space-between; }
        #split-container { flex: 1; display: flex; height: calc(100vh - 40px); overflow: hidden; position: relative; }
        #pane-left { width: 50%; display: flex; flex-direction: column; border-right: 1px solid var(--border); }
        .CodeMirror { flex: 1; font-family: 'Fira Code', monospace; font-size: 14px; }
        #resizer-vertical { width: 5px; background: var(--bg-sidebar); cursor: col-resize; z-index: 10; border-left: 1px solid var(--border); }
        #pane-right { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); overflow: hidden; }
        
        .tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--bg-sidebar); }
        .tab { padding: 8px 16px; cursor: pointer; font-size: 0.85rem; border-right: 1px solid var(--border); opacity: 0.7; }
        .tab.active { background: var(--bg-main); opacity: 1; font-weight: bold; border-top: 2px solid var(--accent); }
        #preview-content, #terminal-content { flex: 1; overflow-y: auto; padding: 20px; display: none; }
        #preview-content.active, #terminal-content.active { display: block; }

        #empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-secondary); position: absolute; top:0; left:0; right:0; bottom:0; z-index: 50; background: var(--bg-main); }
        #ide-container { display: none; flex-direction: column; height: 100%; width: 100%; }
        #cloud-loader { height: 2px; background: linear-gradient(90deg, var(--accent), var(--success)); width: 0%; position: absolute; top: 0; left: 0; z-index: 200; transition: 0.3s; }
        .spinner { border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 2px solid white; width: 12px; height: 12px; animation: spin 1s linear infinite; display: none; margin-right: 5px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header-panel">
            <div class="top-row">
                <div class="brand">⚡ CF Tracker Pro</div>
                <div class="top-actions">
                    <img id="user-avatar" src="" title="Logged In">
                    <button class="btn btn-sm" id="authBtn" onclick="handleAuth()">Login</button>
                    <button class="btn btn-sm" onclick="toggleTheme()" title="Theme">🌙</button>
                </div>
            </div>
            
            <div class="control-row">
                <input type="text" id="handleInput" placeholder="Handle" onchange="syncUser()">
                <button class="btn btn-primary" id="syncBtn" onclick="syncUser()" title="Sync">↻</button>
                <button class="btn" id="bmBtn" onclick="toggleBookmarksView()" title="Bookmarks">★</button>
            </div>

            <div class="control-row" style="margin-top:2px;">
                <input type="text" id="problemSearch" placeholder="Search (e.g. 4A, 1600B)" onkeyup="if(event.key === 'Enter') searchProblem()">
            </div>

            <div class="filter-row">
                <select id="divFilter" onchange="applyFilters()">
                    <option value="ALL">All Divs</option>
                    <option value="Div. 1">Div 1</option>
                    <option value="Div. 2">Div 2</option>
                    <option value="Div. 3">Div 3</option>
                    <option value="Div. 4">Div 4</option>
                    <option value="Educational">Educational</option>
                    <option value="Global">Global</option>
                </select>
                <label class="filter-item"><input type="checkbox" id="roundFilter" checked onchange="applyFilters()"> Std.</label>
            </div>
            <div id="bg-stats"></div>
        </div>
        <div id="contest-list"><div id="sentinel" style="height: 20px;"></div></div>
        <div id="bookmark-list"></div>
    </div>

    <div id="workspace">
        <div id="cloud-loader"></div>
        <div id="empty-state">
            <h2>Select a Problem</h2>
            <p id="cloud-status" style="margin-top:10px; font-size:0.9rem;">☁️ Login to sync</p>
        </div>

        <div id="ide-container">
            <div id="nav-bar">
                <div style="display:flex; align-items:center;">
                    <button id="menu-btn" onclick="toggleSidebar()" style="background:none;border:none;color:inherit;cursor:pointer;font-size:1.2rem;">☰</button>
                    <span id="active-problem-name" style="margin-left:10px; font-weight:bold;">Problem Name</span>
                </div>
                <div style="display:flex; align-items:center; gap:8px;">
                    <span id="save-status" style="font-size:0.75rem; color:gray;"></span>
                    <button class="btn" onclick="openProblemInNewTab()">↗ Open in CF</button>
                    <button class="btn" onclick="copyCode()">Copy</button>
                    <button class="btn btn-run" id="runBtn" onclick="runCode()">
                        <div class="spinner" id="runSpinner"></div>
                        <span id="runBtnText">▶ Run</span>
                    </button>
                    <button class="btn btn-primary" onclick="submitToCF()">Submit</button>
                    <button class="btn" onclick="closeEditor()" style="color:var(--danger)">✕</button>
                </div>
            </div>

            <div id="split-container">
                <div id="pane-left">
                    <div class="editor-tabs">
                        <div class="tab-btn active" id="tab-code" onclick="switchLeftTab('code')">Code</div>
                        <div class="tab-btn" id="tab-solution" onclick="switchLeftTab('solution')">My Sub</div>
                    </div>
                    <textarea id="code-editor"></textarea>
                </div>
                <div id="resizer-vertical"></div>
                <div id="pane-right">
                    <div class="tabs">
                        <div class="tab active" onclick="setRightTab('preview')">Statement</div>
                        <div class="tab" onclick="setRightTab('terminal')">Terminal</div>
                        <div class="tab" onclick="setRightTab('notes')">Notes</div>
                    </div>
                    
                    <div id="preview-content" class="active">Loading...</div>

                    <div id="terminal-content">
                        <div class="terminal-grid">
                            <div class="io-box">
                                <span class="io-label">INPUT</span>
                                <textarea id="term-input" class="io-area"></textarea>
                            </div>
                            <div class="io-box">
                                <div class="io-label">OUTPUT <span id="term-status"></span></div>
                                <div id="term-output" class="output-container">Run to see output...</div>
                            </div>
                        </div>
                    </div>

                    <div id="notes-content">
                        <textarea id="notes-area" placeholder="Write your notes here..."></textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCrNSBbljjJ0AUlGlQQtJixmEyDwGdYuZQ", authDomain: "cf-tracker-48be1.firebaseapp.com", projectId: "cf-tracker-48be1", storageBucket: "cf-tracker-48be1.firebasestorage.app", messagingSenderId: "134861845087", appId: "1:134861845087:web:7344ad4b9c0e9945fb61ea" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let state = {
            allContests: JSON.parse(localStorage.getItem('cf_cache_contests') || '[]'),
            filteredContests: [], renderedCount: 0,
            solved: new Set(JSON.parse(localStorage.getItem('cf_cache_solved') || '[]')),
            attemptedContests: new Set(JSON.parse(localStorage.getItem('cf_cache_attempted_contests') || '[]')),
            submissionMap: new Map(JSON.parse(localStorage.getItem('cf_cache_submission_map') || '[]')),
            contestTotals: new Map(JSON.parse(localStorage.getItem('cf_cache_totals') || '[]')), 
            bookmarks: new Map(), activeProblem: null, user: null,
            bgFetchQueue: [], currentLeftTab: 'code', currentRightTab: 'preview',
            expectedOutput: "" 
        };

        const editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
            mode: "text/x-c++src", lineNumbers: true, theme: "ayu-mirage", autoCloseBrackets: true,
            extraKeys: { "Ctrl-Enter": function(cm){runCode();} }
        });

        async function init() {
            const theme = localStorage.getItem('cf_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            editor.setOption("theme", theme === 'dark' ? 'ayu-mirage' : 'eclipse');

            if(state.allContests.length > 0) applyFilters();
            fetchContests();

            auth.onAuthStateChanged(async (u) => {
                state.user = u;
                updateAuthUI();
                if(u) await loadUserData(u.uid);
            });

            const h = localStorage.getItem('cf_handle');
            if(h) document.getElementById('handleInput').value = h;

            const obs = new IntersectionObserver(e => { if(e[0].isIntersecting && state.viewMode === 'contests') renderNextBatch(); }, { rootMargin: '200px' });
            obs.observe(document.getElementById('sentinel'));
            initResizers();
        }

        // --- FETCH WITH RETRY (The Fix) ---
        async function fetchWithRetry(url) {
            // Strategy: Race multiple proxies
            const proxies = [
                `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
                `https://corsproxy.io/?${encodeURIComponent(url)}`
            ];

            // Try first proxy
            try {
                const res = await fetch(proxies[0]);
                const data = await res.json();
                if(data.contents) return data.contents;
            } catch(e) {}

            // Try second proxy (Text based)
            try {
                const res = await fetch(proxies[1]);
                const text = await res.text();
                if(text.length > 500) return text;
            } catch(e) {}

            throw new Error("Fetch failed");
        }

        // --- ROBUST RUNNER ---
        async function runCode() {
            switchRightTab('terminal');
            const btn = document.getElementById('runBtn');
            const btnText = document.getElementById('runBtnText');
            const spinner = document.getElementById('runSpinner');
            const outputDiv = document.getElementById('term-output');
            const statusSpan = document.getElementById('term-status');
            
            btn.disabled = true; btnText.innerText = "Running..."; spinner.style.display = "inline-block";
            outputDiv.innerHTML = '<span style="color:gray;">Compiling & Executing...</span>';
            statusSpan.innerHTML = '';

            try {
                const res = await fetch('https://emkc.org/api/v2/piston/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        language: "cpp", version: "10.2.0",
                        files: [{ content: editor.getValue() }],
                        stdin: document.getElementById('term-input').value
                    })
                });
                const data = await res.json();
                
                let html = "";
                // Handle Compile Errors
                if(data.compile && data.compile.stderr) {
                    html += `<div style="color:var(--danger); font-weight:bold;">COMPILATION ERROR:</div>`;
                    html += `<div class="raw-output">${data.compile.stderr}</div>`;
                    statusSpan.innerHTML = '<span class="status-badge status-err">Error</span>';
                } 
                // Handle Runtime
                else if(data.run) {
                    if(data.run.stderr) {
                        html += `<div style="color:var(--danger); font-weight:bold;">RUNTIME ERROR:</div>`;
                        html += `<div class="raw-output">${data.run.stderr}</div>`;
                        statusSpan.innerHTML = '<span class="status-badge status-err">Error</span>';
                    } else {
                        // Success path - Display Output even if simple
                        const actual = (data.run.stdout || "").trim();
                        const expected = state.expectedOutput ? state.expectedOutput.trim() : "";
                        
                        if(expected) {
                            if(actual === expected) {
                                html += `<div style="color:var(--success); font-weight:bold;">✅ MATCH</div>`;
                                html += `<div class="raw-output">${actual}</div>`;
                                statusSpan.innerHTML = '<span class="status-badge status-ok">Passed</span>';
                            } else {
                                html += `<div class="diff-block"><div class="diff-label">YOUR OUTPUT</div><div class="diff-val-actual">${actual || "[No Output]"}</div></div>`;
                                html += `<div class="diff-block"><div class="diff-label">EXPECTED</div><div class="diff-val-expected">${expected}</div></div>`;
                                statusSpan.innerHTML = '<span class="status-badge status-err">Wrong Answer</span>';
                            }
                        } else {
                            html += `<div class="raw-output">${data.run.stdout || "[Program finished with no output]"}</div>`;
                            statusSpan.innerHTML = '<span class="status-badge" style="border:1px solid gray;">Done</span>';
                        }
                    }
                }
                outputDiv.innerHTML = html;
            } catch(e) { outputDiv.innerText = "Connection Error"; } 
            finally { btn.disabled = false; btnText.innerText = "▶ Run"; spinner.style.display = "none"; }
        }

        // --- PROBLEM PARSER ---
        async function loadProblemPreview(cid, index) {
            const previewDiv = document.getElementById('preview-content');
            previewDiv.innerHTML = '<div style="padding:20px; text-align:center;">Fetching Problem...</div>';
            state.expectedOutput = ""; 
            
            try {
                const htmlContent = await fetchWithRetry(`https://codeforces.com/contest/${cid}/problem/${index}`);
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlContent, 'text/html');
                
                // Anti-Bot Check
                if(doc.title.includes("Just a moment") || doc.body.innerText.includes("security check")) throw new Error("Cloudflare");

                // Find content
                const statement = doc.querySelector('.problem-statement') || doc.querySelector('.ttypography');
                
                if(statement) {
                    // Fix Images
                    statement.querySelectorAll('img').forEach(img => {
                        const src = img.getAttribute('src');
                        if(src && src.startsWith('/')) img.src = 'https://codeforces.com' + src;
                    });
                    
                    // Render
                    previewDiv.innerHTML = statement.innerHTML;
                    if(window.MathJax) MathJax.typesetPromise([previewDiv]);

                    // Parse I/O
                    const inputPre = statement.querySelector('.input pre');
                    const outputPre = statement.querySelector('.output pre');
                    if(inputPre) document.getElementById('term-input').value = inputPre.innerText;
                    if(outputPre) {
                        state.expectedOutput = outputPre.innerText;
                        document.getElementById('term-output').innerText = "Run code to check against sample case...";
                    }
                } else throw new Error("Parse Error");
            } catch(e) {
                previewDiv.innerHTML = `<div style="text-align:center; padding:20px; color:gray;"><h3>Load Failed</h3><button class="btn" onclick="openProblemInNewTab()">Open in New Tab</button></div>`;
            }
        }

        // --- TABS & LAYOUT ---
        function switchLeftTab(tab) {
            state.currentLeftTab = tab;
            document.getElementById('tab-code').classList.toggle('active', tab === 'code');
            document.getElementById('tab-solution').classList.toggle('active', tab === 'solution');
            document.getElementById('view-sub-btn').style.display = (tab === 'solution') ? 'block' : 'none';
            if(tab === 'code') {
                editor.setOption("readOnly", false);
                editor.setValue(localStorage.getItem(`cf_note_${state.activeProblem.id}`) || getDefaultTemplate());
            } else {
                editor.setOption("readOnly", true);
                editor.setValue("// Loading...");
                // Fetch Solution Logic would go here
            }
        }
        function switchRightTab(tab) {
            state.currentRightTab = tab;
            ['preview','terminal','notes'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.toggle('active', tab === t);
                document.getElementById(`${t}-content`).classList.toggle('active', tab === t);
            });
        }
        
        // --- EDITOR LOGIC ---
        async function openEditor(pid, cid, index, name) {
            state.activeProblem = { id: pid, cid, index, name };
            
            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('ide-container').style.display = 'flex';
            document.getElementById('active-problem-name').innerText = `${index}. ${name}`;
            document.getElementById('sidebar').classList.add('collapsed');

            switchLeftTab('code'); 
            switchRightTab('preview');
            
            // Local Load
            const defCode = getDefaultTemplate();
            editor.setValue(localStorage.getItem(`cf_note_${pid}`) || defCode);
            document.getElementById('notes-area').value = localStorage.getItem(`cf_text_${pid}`) || "";

            // Cloud Load
            if(state.user) {
                db.collection('users').doc(state.user.uid).collection('notes').doc(pid).get().then(doc => {
                    if(doc.exists) {
                        editor.setValue(doc.data().content || defCode);
                        document.getElementById('notes-area').value = doc.data().note_text || "";
                    }
                });
            }

            loadProblemPreview(cid, index);
            setTimeout(() => editor.refresh(), 10);
        }

        let saveTimeout;
        function triggerSave() { 
            clearTimeout(saveTimeout); 
            saveTimeout = setTimeout(doSave, 1000); 
            document.getElementById('save-status').innerText = "Saving..."; 
        }
        function doSave() {
            if(!state.activeProblem) return;
            const pid = state.activeProblem.id;
            let data = {};
            
            if(state.currentLeftTab === 'code') {
                const code = editor.getValue();
                localStorage.setItem(`cf_note_${pid}`, code);
                data.content = code;
            }
            const notes = document.getElementById('notes-area').value;
            localStorage.setItem(`cf_text_${pid}`, notes);
            data.note_text = notes;

            if(state.user && Object.keys(data).length > 0) {
                db.collection('users').doc(state.user.uid).collection('notes').doc(pid).set(data, { merge: true });
            }
            document.getElementById('save-status').innerText = "Saved";
        }
        editor.on('change', () => { if(state.currentLeftTab === 'code') triggerSave(); });
        document.getElementById('notes-area').addEventListener('input', triggerSave);

        // --- UTILS ---
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }
        function toggleRightSidebar() { 
            const p = document.getElementById('pane-info'); 
            const r = document.getElementById('resizer-right');
            p.style.display = p.style.display==='none'?'flex':'none'; 
            r.style.display = p.style.display==='none'?'none':'block';
            editor.refresh();
        }
        function closeEditor() { 
            state.activeProblem = null; 
            document.getElementById('ide-container').style.display = 'none'; 
            document.getElementById('empty-state').style.display = 'flex';
            document.getElementById('sidebar').classList.remove('collapsed');
        }
        function getDefaultTemplate() { return `// ${state.activeProblem ? state.activeProblem.name : 'Solution'}\n#include <bits/stdc++.h>\nusing namespace std;\n\nvoid solve() {\n    \n}\n\nint main() {\n    ios::sync_with_stdio(0); cin.tie(0);\n    int t; cin >> t;\n    while(t--) solve();\n}`; }
        function copyCode() { navigator.clipboard.writeText(editor.getValue()); }
        function submitToCF() { if(state.activeProblem) { copyCode(); window.open(`https://codeforces.com/contest/${state.activeProblem.cid}/submit?problemIndex=${state.activeProblem.index}`, '_blank'); } }
        function openProblemInNewTab() { if(state.activeProblem) window.open(`https://codeforces.com/contest/${state.activeProblem.cid}/problem/${state.activeProblem.index}`, '_blank'); }
        function openExternalSub() { const subId = state.submissionMap.get(state.activeProblem.id); if(subId) window.open(`https://codeforces.com/contest/${state.activeProblem.cid}/submission/${subId}`, '_blank'); }
        function handleAuth() { if(state.user) auth.signOut(); else auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
        function updateAuthUI() { 
            const btn = document.getElementById('authBtn'); 
            const avatar = document.getElementById('user-avatar');
            if(state.user) { btn.innerText = "Exit"; avatar.src = state.user.photoURL; avatar.style.display = 'block'; }
            else { btn.innerText = "Login"; avatar.style.display = 'none'; }
        }
        function toggleTheme() {
            const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next); localStorage.setItem('cf_theme', next);
            editor.setOption("theme", next === 'dark' ? 'ayu-mirage' : 'eclipse');
        }
        function initResizers() {
            const rLeft = document.getElementById('resizer-left');
            const sidebar = document.getElementById('sidebar');
            rLeft.addEventListener('mousedown', e => { e.preventDefault(); document.addEventListener('mousemove', resizeL); document.addEventListener('mouseup', stopL); });
            function resizeL(e) { sidebar.style.width = Math.max(250, Math.min(600, e.clientX)) + 'px'; }
            function stopL() { document.removeEventListener('mousemove', resizeL); document.removeEventListener('mouseup', stopL); }

            const rRight = document.getElementById('resizer-right');
            const paneInfo = document.getElementById('pane-info');
            const ideBody = document.getElementById('ide-body');
            rRight.addEventListener('mousedown', e => { e.preventDefault(); document.addEventListener('mousemove', resizeR); document.addEventListener('mouseup', stopR); });
            function resizeR(e) { const w = ideBody.getBoundingClientRect().right - e.clientX; paneInfo.style.width = Math.max(200, Math.min(800, w)) + 'px'; }
            function stopR() { document.removeEventListener('mousemove', resizeR); document.removeEventListener('mouseup', stopR); }
        }

        // --- APP SYNC ---
        async function fetchContests() {
            try {
                const res = await fetch(API_CONTESTS); const data = await res.json();
                if(data.status==='OK') { state.allContests = data.result.filter(c=>c.phase==='FINISHED').sort((a,b)=>b.id-a.id); localStorage.setItem('cf_cache_contests', JSON.stringify(state.allContests)); applyFilters(); }
            } catch(e){}
        }
        async function syncUser(showUI=true) {
            const h = document.getElementById('handleInput').value; if(!h) return;
            localStorage.setItem('cf_handle', h);
            if(state.user) db.collection('users').doc(state.user.uid).set({ cfHandle: h }, { merge: true });
            const btn = document.getElementById('syncBtn'); if(showUI) btn.innerText = "...";
            try {
                const res = await fetch(`${API_USER}?handle=${h}`); const data = await res.json();
                if(data.status==='OK') {
                    state.solved.clear(); state.attemptedContests.clear(); state.submissionMap.clear();
                    data.result.forEach(s => { 
                        state.attemptedContests.add(s.contestId);
                        if(s.verdict === 'OK') {
                            const pid = `${s.contestId}${s.problem.index}`;
                            state.solved.add(pid);
                            if(!state.submissionMap.has(pid)) state.submissionMap.set(pid, s.id); 
                        }
                    });
                    localStorage.setItem('cf_cache_solved', JSON.stringify([...state.solved]));
                    localStorage.setItem('cf_cache_submission_map', JSON.stringify([...state.submissionMap]));
                    applyFilters(); if(showUI) btn.innerText = "✓";
                }
            } catch(e) { if(showUI) btn.innerText = "!"; }
            setTimeout(() => btn.innerText = "↻", 2000);
        }
        async function loadUserData(uid) {
            document.getElementById('cloud-loader').style.width = '70%';
            try {
                const doc = await db.collection('users').doc(uid).get();
                if(doc.exists) {
                    const data = doc.data();
                    if(data.cfHandle) { document.getElementById('handleInput').value = data.cfHandle; syncUser(false); }
                    if(data.bookmarks) { state.bookmarks = new Map(Object.entries(data.bookmarks)); }
                }
            } catch(e){}
            document.getElementById('cloud-loader').style.width = '0%';
        }
        function applyFilters() {
            const onlyStd = document.getElementById('roundFilter').checked;
            const onlyAtt = document.getElementById('attemptedFilter').checked;
            const div = document.getElementById('divFilter').value;
            state.filteredContests = state.allContests.filter(c => {
                const n = c.name;
                if(onlyStd && !((n.includes("Codeforces Round") || n.includes("Educational")) && !n.includes("Hello") && !n.includes("Good Bye"))) return false;
                if(onlyAtt && !state.attemptedContests.has(c.id)) return false;
                if(div !== "ALL" && !n.includes(div)) return false;
                return true;
            });
            document.querySelectorAll('.contest-card').forEach(e => e.remove());
            state.renderedCount = 0;
            renderNextBatch();
        }
        function renderNextBatch() {
            const list = document.getElementById('contest-list');
            const batch = state.filteredContests.slice(state.renderedCount, state.renderedCount + 20);
            batch.forEach(c => {
                const card = document.createElement('div'); card.className = 'contest-card'; card.dataset.cid = c.id;
                let bgStyle = '';
                if(state.contestTotals.has(c.id)) {
                    let total = state.contestTotals.get(c.id), solved = 0;
                    for (let s of state.solved) { if(s.startsWith(c.id)) solved++; }
                    let pct = Math.min(100, Math.round((solved/total)*100));
                    bgStyle = `style="background: linear-gradient(90deg, var(--progress-fill) ${pct}%, var(--progress-bg) ${pct}%)"`;
                }
                card.innerHTML = `<div class="contest-header" onclick="toggleContest(this, ${c.id})" ${bgStyle}><span style="font-weight:500;">${c.name}</span><span class="tag" style="background:var(--tag-bg); padding:2px 6px; border-radius:4px; font-size:0.75rem;">#${c.id}</span></div><div class="contest-body"></div>`;
                list.insertBefore(card, document.getElementById('sentinel'));
            });
            state.renderedCount += 20;
        }
        async function toggleContest(header, cid) {
            const card = header.parentElement; const body = card.querySelector('.contest-body');
            const cacheKey = `cf_contest_${cid}`;
            if(card.classList.toggle('open')) {
                const cached = localStorage.getItem(cacheKey);
                if(cached) { renderProblemsInBody(body, JSON.parse(cached), cid); }
                else {
                    body.innerHTML = '<div style="padding:10px; text-align:center">Loading...</div>';
                    try {
                        const res = await fetch(`https://codeforces.com/api/contest.standings?contestId=${cid}&from=1&count=1`);
                        const data = await res.json();
                        if(data.status === 'OK') {
                            const problems = data.result.problems;
                            localStorage.setItem(cacheKey, JSON.stringify(problems));
                            if(!state.contestTotals.has(cid)) state.contestTotals.set(cid, problems.length);
                            renderProblemsInBody(body, problems, cid);
                        }
                    } catch(e) { body.innerHTML = 'Error'; }
                }
            }
        }
        function renderProblemsInBody(body, problems, cid) {
            body.innerHTML = problems.map(p => {
                const pid = `${cid}${p.index}`;
                const isSolved = state.solved.has(pid);
                const isBookmarked = state.bookmarks.has(pid);
                const cleanName = p.name.replace(/'/g,"");
                const ratingHtml = p.rating ? `<span class="topic-pill rating-pill">${p.rating}</span>` : '';
                return `<div class="problem-row ${isSolved ? 'solved' : ''}" onclick="openEditor('${pid}', ${cid}, '${p.index}', '${cleanName}')">
                    <div class="p-status">${isSolved ? '✅' : ''}</div>
                    <div class="p-index">${p.index}</div>
                    <div class="p-content"><div class="p-name">${p.name}</div><div class="topic-list">${ratingHtml}</div></div>
                    <div class="p-actions"><button class="icon-btn ${isBookmarked ? 'starred' : ''}" onclick="event.stopPropagation(); toggleBookmark('${pid}')">★</button></div>
                </div>`;
            }).join('');
        }
        function toggleBookmark(pid) {
            if(state.bookmarks.has(pid)) state.bookmarks.delete(pid); else state.bookmarks.set(pid, { ts: Date.now() });
            localStorage.setItem('cf_bookmarks_map', JSON.stringify([...state.bookmarks]));
            if(state.user) db.collection('users').doc(state.user.uid).set({ bookmarks: Object.fromEntries(state.bookmarks) }, { merge: true });
        }
        function searchProblem() {
            const q = document.getElementById('problemSearch').value.trim().toUpperCase().match(/^(\d+)([A-Z]\d*)$/);
            if(q) openEditor(`${q[1]}${q[2]}`, parseInt(q[1]), q[2], `Problem ${q[2]}`);
            else alert("Format: 4A");
        }
        function toggleBookmarksView() {
            state.viewMode = state.viewMode === 'contests' ? 'bookmarks' : 'contests';
            document.getElementById('contest-list').style.display = state.viewMode==='contests'?'block':'none';
            document.getElementById('bookmark-list').style.display = state.viewMode==='bookmarks'?'block':'none';
            if(state.viewMode === 'bookmarks') {
                const list = document.getElementById('bookmark-list');
                list.innerHTML = '<h3>Bookmarks</h3>';
                state.bookmarks.forEach((v,k) => list.innerHTML += `<div style="padding:10px; border-bottom:1px solid var(--border); cursor:pointer;" onclick="openEditor('${k}', ${parseInt(k)}, '${k.replace(/\d+/,'')}', 'Bookmarked')">${k}</div>`);
            }
        }

        init();
    </script>
</body>
</html>
