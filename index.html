<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CF Tracker Pro v28 (User Stats)</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/ayu-mirage.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/eclipse.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/edit/closebrackets.min.js"></script>

    <style>
        :root[data-theme="dark"] {
            --bg-main: #0d1117; --bg-sidebar: #161b22; --bg-card: #21262d;
            --bg-hover: #30363d; --border: #30363d; --text-primary: #c9d1d9;
            --text-secondary: #8b949e; --accent: #58a6ff; --success: #238636;
            --danger: #f85149; --gold: #e3b341; --vscode: #007acc; --tag-bg: #1f2428;
            --progress-fill: rgba(35, 134, 54, 0.4); --progress-bg: #21262d;
            --tab-active-bg: #1f2428; --tab-inactive-bg: #161b22;
            --highlight: rgba(210, 153, 34, 0.3);
        }
        :root[data-theme="light"] {
            --bg-main: #ffffff; --bg-sidebar: #f6f8fa; --bg-card: #ffffff;
            --bg-hover: #eaeef2; --border: #d0d7de; --text-primary: #24292f;
            --text-secondary: #57606a; --accent: #0969da; --success: #1a7f37;
            --danger: #cf222e; --gold: #d29922; --tag-bg: #eff1f3;
            --progress-fill: rgba(26, 127, 55, 0.25); --progress-bg: #ffffff;
            --tab-active-bg: #ffffff; --tab-inactive-bg: #f6f8fa;
            --highlight: rgba(210, 153, 34, 0.3);
        }

        /* Codeforces Rating Colors */
        .u-gray { background-color: #808080; color: white; }
        .u-green { background-color: #008000; color: white; }
        .u-cyan { background-color: #03a89e; color: white; }
        .u-blue { background-color: #0000ff; color: white; }
        .u-violet { background-color: #aa00aa; color: white; }
        .u-orange { background-color: #ff8c00; color: white; }
        .u-red { background-color: #ff0000; color: white; }

        * { box-sizing: border-box; outline: none; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-main); color: var(--text-primary); display: flex; height: 100vh; overflow: hidden; }

        #sidebar { width: 480px; background: var(--bg-sidebar); display: flex; flex-direction: column; flex-shrink: 0; border-right: 1px solid var(--border); position: relative; }
        .header-panel { padding: 10px; border-bottom: 1px solid var(--border); background: var(--bg-sidebar); display: flex; flex-direction: column; gap: 8px; }
        .top-row { display: flex; justify-content: space-between; align-items: center; height: 28px; }
        .brand { font-weight: 700; font-size: 1rem; display: flex; align-items: center; gap: 6px; }
        .top-actions { display: flex; align-items: center; gap: 8px; }
        #user-avatar { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--border); display: none; }
        
        .control-row { display: flex; gap: 6px; height: 32px; }
        input[type="text"] { background: var(--bg-main); border: 1px solid var(--border); color: var(--text-primary); padding: 4px 10px; border-radius: 6px; flex: 1; font-size: 0.9rem; }
        #problemSearch { border-color: var(--border); }
        #problemSearch:focus { border-color: var(--gold); }

        /* USER INFO ROW (NEW) */
        #user-info-row { display: none; align-items: center; gap: 8px; font-size: 0.8rem; margin-top: -4px; margin-bottom: 2px; }
        #rating-pill { padding: 1px 6px; border-radius: 4px; font-weight: bold; font-size: 0.75rem; }
        #profile-link { text-decoration: none; color: var(--text-secondary); display: flex; align-items: center; gap: 3px; }
        #profile-link:hover { color: var(--accent); }

        .btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); padding: 0 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn:hover { background: var(--bg-hover); }
        .btn-primary { background: var(--success); border-color: var(--success); color: white; }
        .btn-sm { font-size: 0.75rem; padding: 2px 10px; height: 24px; }
        
        .filter-row { display: flex; align-items: center; gap: 15px; font-size: 0.85rem; color: var(--text-secondary); margin-top: 2px; }
        .filter-item { display: flex; align-items: center; gap: 5px; cursor: pointer; }
        #bg-stats { font-size: 0.75rem; color: var(--accent); margin-top: 2px; height: 14px; white-space: nowrap; overflow: hidden; }

        #contest-list, #bookmark-list { flex: 1; overflow-y: auto; padding: 10px; scroll-behavior: smooth; }
        #bookmark-list { display: none; }
        .contest-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; overflow: hidden; }
        .contest-header { padding: 10px 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: var(--progress-bg); transition: background 0.5s ease; }
        .contest-header:hover { opacity: 0.9; }
        .contest-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; border-top: 1px solid transparent; background: var(--bg-card); }
        .contest-card.open .contest-body { max-height: 5000px; border-top-color: var(--border); }

        .problem-row { display: grid; grid-template-columns: 24px 35px 1fr 60px; align-items: start; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--bg-sidebar); gap: 8px; transition: background 0.5s; }
        .problem-row:hover { background: var(--bg-hover); }
        .problem-row.solved { border-left: 3px solid var(--success); background: rgba(35, 134, 54, 0.08); }
        .problem-row.highlight-row { animation: flashHighlight 2s ease-out; border-left: 3px solid var(--gold); }
        @keyframes flashHighlight { 0% { background: var(--highlight); } 100% { background: var(--bg-sidebar); } }

        .p-status { text-align: center; padding-top: 2px; }
        .p-index { font-weight: bold; color: var(--accent); padding-top: 2px; }
        .p-content { display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
        .p-name { font-weight: 500; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .topic-list { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; flex-wrap: wrap; }
        .topic-pill { font-size: 0.75rem; background: var(--tag-bg); color: var(--text-secondary); padding: 1px 7px; border-radius: 12px; white-space: nowrap; border: 1px solid var(--border); }
        .topic-pill.rating-pill { color: #d19a66; border-color: #d19a66; font-weight: 700; }
        [data-theme="light"] .topic-pill.rating-pill { color: #b07d47; border-color: #b07d47; }
        .p-actions { display: flex; gap: 4px; justify-content: flex-end; }
        .icon-btn { background: transparent; border: 1px solid transparent; cursor: pointer; font-size: 1rem; padding: 2px 5px; opacity: 0.6; transition: 0.2s; border-radius: 4px; }
        .icon-btn:hover { opacity: 1; background: var(--bg-hover); border-color: var(--border); }
        .icon-btn.starred { color: var(--gold); opacity: 1; }
        .icon-btn.has-note { color: var(--accent); opacity: 1; }

        #main-content { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); }
        #editor-container { display: none; flex-direction: column; height: 100%; }
        .editor-header { background: var(--bg-sidebar); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; }
        .editor-tabs { display: flex; gap: 2px; padding: 0 10px; margin-top: 10px; }
        .tab-btn { padding: 6px 15px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border-radius: 6px 6px 0 0; background: var(--tab-inactive-bg); border: 1px solid var(--border); border-bottom: none; opacity: 0.7; }
        .tab-btn.active { background: var(--tab-active-bg); opacity: 1; border-top: 2px solid var(--accent); }
        .editor-toolbar { padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: var(--tab-active-bg); }
        .CodeMirror { flex: 1; font-family: 'Fira Code', monospace; font-size: 14px; }
        .save-status { font-size: 0.75rem; color: var(--text-secondary); margin-right: 10px; font-style: italic; }
        #view-sub-btn { display: none; }

        #cloud-loader { height: 2px; background: linear-gradient(90deg, var(--accent), var(--success)); width: 0%; transition: 0.3s; position: absolute; top: 0; left: 0; z-index: 50; }
        #resizer { width: 5px; cursor: col-resize; background: transparent; position: absolute; right: 0; top: 0; bottom: 0; z-index: 10; }
        #empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-secondary); }
    </style>
</head>
<body>

    <div id="sidebar">
        <div id="cloud-loader"></div>
        <div class="header-panel">
            <div class="top-row">
                <div class="brand">⚡ CF Tracker</div>
                <div class="top-actions">
                    <img id="user-avatar" src="" title="Logged In">
                    <button class="btn btn-sm" id="authBtn" onclick="handleAuth()">Login</button>
                    <button class="btn btn-sm" onclick="toggleTheme()" title="Theme">🌙</button>
                </div>
            </div>
            
            <div class="control-row">
                <input type="text" id="handleInput" placeholder="Handle" onchange="syncUser()">
                <button class="btn btn-primary" id="syncBtn" onclick="syncUser()" title="Sync">↻</button>
                <button class="btn" id="bmBtn" onclick="toggleBookmarksView()" title="Bookmarks">★</button>
            </div>

            <div id="user-info-row">
                <span id="rating-pill"></span>
                <a id="profile-link" href="#" target="_blank">↗ Profile</a>
            </div>

            <div class="control-row" style="margin-top:2px;">
                <input type="text" id="problemSearch" placeholder="Search (e.g. 4A, 1600B)" onkeyup="if(event.key === 'Enter') searchProblem()">
            </div>

            <div class="filter-row">
                <label class="filter-item"><input type="checkbox" id="roundFilter" checked onchange="applyFilters()"> Standard</label>
                <label class="filter-item" style="color:var(--accent);"><input type="checkbox" id="attemptedFilter" onchange="applyFilters()"> Attempted</label>
            </div>
            <div id="bg-stats"></div>
        </div>
        <div id="contest-list"><div id="sentinel" style="height: 20px;"></div></div>
        <div id="bookmark-list"></div>
        <div id="resizer"></div>
    </div>

    <div id="main-content">
        <div id="empty-state">
            <h2>Select a Problem</h2>
            <p id="cloud-status" style="margin-top:10px; font-size:0.9rem;">☁️ Login to sync</p>
        </div>
        <div id="editor-container">
            <div class="editor-header">
                <div class="editor-tabs">
                    <div class="tab-btn active" id="tab-notes" onclick="switchTab('notes')">Notes</div>
                    <div class="tab-btn" id="tab-solution" onclick="switchTab('solution')">My Solution</div>
                </div>
                <div class="editor-toolbar">
                    <span id="active-title" style="font-weight:bold; font-size:0.9rem;">Problem</span>
                    <div style="display:flex; align-items:center; gap:5px;">
                        <span class="save-status" id="save-indicator">Saved</span>
                        <button class="btn" id="view-sub-btn" onclick="openExternalSub()">↗ View on CF</button>
                        <button class="btn" onclick="copyCode()">Copy</button>
                        <button class="btn btn-primary" onclick="submitToCF()">Submit</button>
                        <button class="btn" onclick="closeEditor()" style="color:var(--danger); border-color:var(--danger)">✕</button>
                    </div>
                </div>
            </div>
            <textarea id="code-editor"></textarea>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCrNSBbljjJ0AUlGlQQtJixmEyDwGdYuZQ",
            authDomain: "cf-tracker-48be1.firebaseapp.com",
            projectId: "cf-tracker-48be1",
            storageBucket: "cf-tracker-48be1.firebasestorage.app",
            messagingSenderId: "134861845087",
            appId: "1:134861845087:web:7344ad4b9c0e9945fb61ea"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const API_CONTESTS = 'https://codeforces.com/api/contest.list';
        const API_USER = 'https://codeforces.com/api/user.status';
        const API_INFO = 'https://codeforces.com/api/user.info';

        let state = {
            allContests: JSON.parse(localStorage.getItem('cf_cache_contests') || '[]'),
            filteredContests: [], renderedCount: 0,
            solved: new Set(JSON.parse(localStorage.getItem('cf_cache_solved') || '[]')),
            attemptedContests: new Set(JSON.parse(localStorage.getItem('cf_cache_attempted_contests') || '[]')),
            submissionMap: new Map(JSON.parse(localStorage.getItem('cf_cache_submission_map') || '[]')),
            contestTotals: new Map(JSON.parse(localStorage.getItem('cf_cache_totals') || '[]')), 
            bookmarks: new Map(), activeProblem: null, viewMode: 'contests', user: null,
            bgFetchQueue: [], currentTab: 'notes'
        };

        const editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
            mode: "text/x-c++src", lineNumbers: true, autoCloseBrackets: true
        });

        async function init() {
            const theme = localStorage.getItem('cf_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            editor.setOption("theme", theme === 'dark' ? 'ayu-mirage' : 'eclipse');

            if(state.allContests.length > 0) applyFilters();
            fetchContests();

            auth.onAuthStateChanged(async (u) => {
                state.user = u;
                updateAuthUI();
                if(u) {
                    await loadUserData(u.uid);
                    document.getElementById('cloud-status').innerText = "☁️ Sync Active";
                } else {
                    const localBM = JSON.parse(localStorage.getItem('cf_bookmarks_map') || '[]');
                    state.bookmarks = new Map(localBM);
                    document.getElementById('cloud-status').innerText = "⚠️ Guest Mode";
                }
            });

            const h = localStorage.getItem('cf_handle');
            if(h) {
                document.getElementById('handleInput').value = h;
                // Fetch info if handle exists but no UI update yet
                fetchUserInfo(h);
            }

            const obs = new IntersectionObserver(e => { if(e[0].isIntersecting && state.viewMode === 'contests') renderNextBatch(); }, { rootMargin: '200px' });
            obs.observe(document.getElementById('sentinel'));
            initResizer();
        }

        function handleAuth() { if(state.user) auth.signOut(); else auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => alert(e.message)); }
        function updateAuthUI() { 
            const btn = document.getElementById('authBtn'); 
            const avatar = document.getElementById('user-avatar');
            if(state.user) { btn.innerText = "Exit"; avatar.src = state.user.photoURL; avatar.style.display = 'block'; }
            else { btn.innerText = "Login"; avatar.style.display = 'none'; }
        }

        async function loadUserData(uid) {
            document.getElementById('cloud-loader').style.width = '70%';
            try {
                const doc = await db.collection('users').doc(uid).get();
                if(doc.exists) {
                    const data = doc.data();
                    if(data.cfHandle) { 
                        document.getElementById('handleInput').value = data.cfHandle; 
                        localStorage.setItem('cf_handle', data.cfHandle); 
                        syncUser(false); 
                    }
                    if(data.bookmarks) {
                        state.bookmarks = new Map(Object.entries(data.bookmarks));
                        localStorage.setItem('cf_bookmarks_map', JSON.stringify([...state.bookmarks]));
                    }
                }
            } catch(e) {}
            document.getElementById('cloud-loader').style.width = '0%';
        }

        async function fetchContests() {
            try {
                const res = await fetch(API_CONTESTS);
                const data = await res.json();
                if(data.status === 'OK') {
                    state.allContests = data.result.filter(c => c.phase === 'FINISHED').sort((a,b) => b.id - a.id);
                    localStorage.setItem('cf_cache_contests', JSON.stringify(state.allContests));
                    applyFilters();
                }
            } catch(e) {}
        }

        async function syncUser(showUI=true) {
            const h = document.getElementById('handleInput').value; if(!h) return;
            localStorage.setItem('cf_handle', h);
            if(state.user) db.collection('users').doc(state.user.uid).set({ cfHandle: h }, { merge: true });

            const btn = document.getElementById('syncBtn'); if(showUI) btn.innerText = "...";
            
            // Fetch User Info (Rating/Rank)
            fetchUserInfo(h);

            try {
                const res = await fetch(`${API_USER}?handle=${h}`);
                const data = await res.json();
                if(data.status === 'OK') {
                    state.solved.clear(); state.attemptedContests.clear(); state.submissionMap.clear();
                    localStorage.removeItem('cf_cache_solved'); localStorage.removeItem('cf_cache_attempted_contests'); localStorage.removeItem('cf_cache_submission_map');
                    
                    document.querySelectorAll('.problem-row.solved').forEach(row => {
                        row.classList.remove('solved'); row.querySelector('.p-status').innerText = '';
                    });

                    data.result.forEach(s => { 
                        state.attemptedContests.add(s.contestId);
                        const pid = `${s.contestId}${s.problem.index}`;
                        if(s.verdict === 'OK') {
                            state.solved.add(pid);
                            if(!state.submissionMap.has(pid)) state.submissionMap.set(pid, s.id); 
                        }
                    });
                    
                    localStorage.setItem('cf_cache_solved', JSON.stringify([...state.solved]));
                    localStorage.setItem('cf_cache_attempted_contests', JSON.stringify([...state.attemptedContests]));
                    localStorage.setItem('cf_cache_submission_map', JSON.stringify([...state.submissionMap]));
                    
                    document.querySelectorAll('.problem-row').forEach(row => {
                        const pid = row.id.replace('row-', '');
                        if(state.solved.has(pid)) { row.classList.add('solved'); row.querySelector('.p-status').innerText = '✅'; }
                    });
                    applyFilters(); 
                    if(showUI) btn.innerText = "✓";
                    startBackgroundProgressFetch();
                }
            } catch(e) { if(showUI) btn.innerText = "!"; }
            setTimeout(() => btn.innerText = "↻", 2000);
        }

        // --- NEW: FETCH USER INFO ---
        async function fetchUserInfo(handle) {
            try {
                const res = await fetch(`${API_INFO}?handles=${handle}`);
                const data = await res.json();
                if(data.status === 'OK' && data.result.length > 0) {
                    const u = data.result[0];
                    const pill = document.getElementById('rating-pill');
                    const row = document.getElementById('user-info-row');
                    const link = document.getElementById('profile-link');
                    
                    // Rating Logic
                    const r = u.rating || 0;
                    pill.innerText = `${u.rank || 'user'} (${r})`;
                    
                    // Reset Classes
                    pill.className = 'rating-pill'; // Base class
                    if (r < 1200) pill.classList.add('u-gray');
                    else if (r < 1400) pill.classList.add('u-green');
                    else if (r < 1600) pill.classList.add('u-cyan');
                    else if (r < 1900) pill.classList.add('u-blue');
                    else if (r < 2100) pill.classList.add('u-violet');
                    else if (r < 2400) pill.classList.add('u-orange');
                    else pill.classList.add('u-red');

                    link.href = `https://codeforces.com/profile/${handle}`;
                    row.style.display = 'flex';
                }
            } catch(e) { console.error("User info fail", e); }
        }

        // --- SEARCH PROBLEM ---
        async function searchProblem() {
            const query = document.getElementById('problemSearch').value.trim().toUpperCase();
            if(!query) return;
            const match = query.match(/^(\d+)([A-Z]\d*)$/);
            if(!match) { alert("Invalid Format. Use 4A, 1600B"); return; }
            const cid = parseInt(match[1]);
            const index = match[2];
            const pid = `${cid}${index}`;
            const contestExists = state.allContests.find(c => c.id === cid);
            if(!contestExists) { alert("Contest " + cid + " not found."); return; }
            state.filteredContests = [contestExists];
            document.querySelectorAll('.contest-card').forEach(e => e.remove());
            state.renderedCount = 0;
            const list = document.getElementById('contest-list');
            const card = document.createElement('div');
            card.className = 'contest-card';
            card.dataset.cid = cid;
            card.innerHTML = `<div class="contest-header" onclick="toggleContest(this, ${cid})"><span style="font-weight:500;">${contestExists.name}</span><span class="tag" style="background:var(--tag-bg); padding:2px 6px; border-radius:4px; font-size:0.75rem;">#${cid}</span></div><div class="contest-body" data-loaded="false"></div>`;
            list.appendChild(card);
            const header = card.querySelector('.contest-header');
            await toggleContest(header, cid);
            setTimeout(() => {
                const row = document.getElementById(`row-${pid}`);
                if(row) {
                    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    row.classList.add('highlight-row');
                    setTimeout(() => row.classList.remove('highlight-row'), 2500);
                } else { alert(`Problem ${index} not found in Contest ${cid}`); }
            }, 500);
        }

        function startBackgroundProgressFetch() {
            state.bgFetchQueue = [...state.attemptedContests].filter(cid => !state.contestTotals.has(cid));
            state.bgFetchQueue.sort((a,b) => b - a);
            if(state.bgFetchQueue.length > 0) { updateStatsBar(); processBackgroundQueue(); }
            else { document.getElementById('bg-stats').innerText = "Stats synced."; setTimeout(() => document.getElementById('bg-stats').innerText = "", 3000); }
        }

        function processBackgroundQueue() {
            if(state.bgFetchQueue.length === 0) { document.getElementById('bg-stats').innerText = ""; return; }
            const cid = state.bgFetchQueue.shift();
            updateStatsBar();
            fetch(`https://codeforces.com/api/contest.standings?contestId=${cid}&from=1&count=1`)
                .then(res => res.json())
                .then(data => {
                    if(data.status === 'OK') {
                        state.contestTotals.set(cid, data.result.problems.length);
                        localStorage.setItem('cf_cache_totals', JSON.stringify([...state.contestTotals]));
                        updateContestCardStyle(cid);
                    }
                })
                .catch(e => {})
                .finally(() => setTimeout(processBackgroundQueue, 800));
        }

        function updateStatsBar() { 
            const el = document.getElementById('bg-stats'); 
            if(state.bgFetchQueue.length>0) el.innerText = `Updating: ${state.bgFetchQueue.length} left...`; 
        }

        function updateContestCardStyle(cid) {
            const header = document.querySelector(`.contest-card[data-cid="${cid}"] .contest-header`);
            if(header && state.contestTotals.has(cid)) {
                let total = state.contestTotals.get(cid);
                let solvedCount = 0;
                for (let s of state.solved) { if (s.startsWith(cid)) solvedCount++; }
                let pct = Math.min(100, Math.round((solvedCount / total) * 100));
                header.style.background = `linear-gradient(90deg, var(--progress-fill) ${pct}%, var(--progress-bg) ${pct}%)`;
            }
        }

        function applyFilters() {
            const onlyStandard = document.getElementById('roundFilter').checked;
            const onlyAttempted = document.getElementById('attemptedFilter').checked;
            state.filteredContests = state.allContests.filter(c => {
                if(onlyStandard) {
                    const n = c.name;
                    if(!((n.includes("Codeforces Round") || n.includes("Educational")) && !n.includes("Hello") && !n.includes("Good Bye") && !n.includes("ICPC"))) return false;
                }
                if(onlyAttempted && !state.attemptedContests.has(c.id)) return false;
                return true;
            });
            document.querySelectorAll('.contest-card').forEach(e => e.remove());
            state.renderedCount = 0;
            renderNextBatch();
        }

        function renderNextBatch() {
            const list = document.getElementById('contest-list');
            const batch = state.filteredContests.slice(state.renderedCount, state.renderedCount + 20);
            batch.forEach(c => {
                const card = document.createElement('div');
                card.className = 'contest-card';
                card.dataset.cid = c.id;
                let headerStyle = '';
                if (state.contestTotals.has(c.id)) {
                    let total = state.contestTotals.get(c.id);
                    let solvedCount = 0;
                    for (let s of state.solved) { if (s.startsWith(c.id)) solvedCount++; }
                    let pct = Math.min(100, Math.round((solvedCount / total) * 100));
                    headerStyle = `style="background: linear-gradient(90deg, var(--progress-fill) ${pct}%, var(--progress-bg) ${pct}%)"`;
                } else if(state.attemptedContests.has(c.id)) { headerStyle = `style="background: var(--progress-bg)"`; }
                card.innerHTML = `<div class="contest-header" onclick="toggleContest(this, ${c.id})" ${headerStyle}><span style="font-weight:500;">${c.name}</span><span class="tag" style="background:var(--tag-bg); padding:2px 6px; border-radius:4px; font-size:0.75rem;">#${c.id}</span></div><div class="contest-body" data-loaded="false"></div>`;
                list.insertBefore(card, document.getElementById('sentinel'));
            });
            state.renderedCount += 20;
        }

        async function toggleContest(header, cid) {
            const card = header.parentElement;
            const body = card.querySelector('.contest-body');
            const cacheKey = `cf_contest_${cid}`;
            if(card.classList.toggle('open')) {
                const cached = localStorage.getItem(cacheKey);
                if(cached) {
                    if (!state.contestTotals.has(cid)) {
                        state.contestTotals.set(cid, JSON.parse(cached).length);
                        localStorage.setItem('cf_cache_totals', JSON.stringify([...state.contestTotals]));
                        updateContestCardStyle(cid);
                    }
                    renderProblemsInBody(body, JSON.parse(cached), cid);
                    body.dataset.loaded = "true";
                } else {
                    body.innerHTML = '<div style="padding:10px; text-align:center">Loading...</div>';
                    try {
                        const res = await fetch(`https://codeforces.com/api/contest.standings?contestId=${cid}&from=1&count=1`);
                        const data = await res.json();
                        if(data.status === 'OK') {
                            const problems = data.result.problems;
                            localStorage.setItem(cacheKey, JSON.stringify(problems));
                            if(!state.contestTotals.has(cid)) {
                                state.contestTotals.set(cid, problems.length);
                                localStorage.setItem('cf_cache_totals', JSON.stringify([...state.contestTotals]));
                                updateContestCardStyle(cid);
                            }
                            renderProblemsInBody(body, problems, cid);
                            body.dataset.loaded = "true";
                        }
                    } catch(e) { body.innerHTML = '<div style="color:var(--danger); padding:10px">Error</div>'; }
                }
            }
        }

        function renderProblemsInBody(body, problems, cid) { body.innerHTML = problems.map(p => createProblemHTML(p, cid)).join(''); }

        function createProblemHTML(p, cid) {
            const pid = `${cid}${p.index}`;
            const isSolved = state.solved.has(pid);
            const isBookmarked = state.bookmarks.has(pid);
            const hasNote = localStorage.getItem(`cf_note_${pid}`) ? 'has-note' : '';
            let ratingHtml = p.rating ? `<span class="topic-pill rating-pill">${p.rating}</span>` : '';
            const tagsHtml = (p.tags || []).map(t => `<span class="topic-pill">${t}</span>`).join('');
            const cleanName = p.name.replace(/'/g,"");
            return `<div class="problem-row ${isSolved ? 'solved' : ''}" id="row-${pid}"><div class="p-status">${isSolved ? '✅' : ''}</div><div class="p-index">${p.index}</div><div class="p-content"><div class="p-name">${p.name}</div><div class="topic-list">${ratingHtml+tagsHtml}</div></div><div class="p-actions"><button class="icon-btn ${isBookmarked ? 'starred' : ''}" onclick="toggleBookmark('${pid}', ${cid}, '${p.index}', '${cleanName}', ${p.rating||0}, '${(p.tags||[]).join(",")}')">★</button><button class="icon-btn ${hasNote}" onclick="openEditor('${pid}', ${cid}, '${p.index}', '${cleanName}')">✎</button><a href="https://codeforces.com/contest/${cid}/problem/${p.index}" target="_blank" class="icon-btn">↗</a></div></div>`;
        }

        function toggleBookmark(pid, cid, idx, name, rating, tags) {
            if(state.bookmarks.has(pid)) state.bookmarks.delete(pid);
            else state.bookmarks.set(pid, { cid, idx, name, rating, tags: tags ? tags.split(',') : [] });
            localStorage.setItem('cf_bookmarks_map', JSON.stringify([...state.bookmarks]));
            if(state.user) db.collection('users').doc(state.user.uid).set({ bookmarks: Object.fromEntries(state.bookmarks) }, { merge: true });
            const row = document.getElementById(`row-${pid}`);
            if(row) row.querySelector('.p-actions button:nth-child(1)').classList.toggle('starred');
            if(state.viewMode === 'bookmarks') renderBookmarks();
        }

        function toggleBookmarksView() {
            state.viewMode = state.viewMode === 'contests' ? 'bookmarks' : 'contests';
            document.getElementById('contest-list').style.display = state.viewMode === 'contests' ? 'block' : 'none';
            document.getElementById('bookmark-list').style.display = state.viewMode === 'bookmarks' ? 'block' : 'none';
            document.getElementById('bmBtn').classList.toggle('btn-active');
            if(state.viewMode === 'bookmarks') renderBookmarks();
        }

        function renderBookmarks() {
            const list = document.getElementById('bookmark-list');
            let html = '<div style="padding:10px; font-weight:bold; font-size:0.9rem;">Bookmarks</div>';
            state.bookmarks.forEach((val, pid) => {
                const p = { index: val.idx, name: val.name, rating: val.rating, tags: val.tags };
                html += createProblemHTML(p, val.cid);
            });
            list.innerHTML = html;
        }

        let saveTimeout;
        
        function switchTab(tabName) {
            state.currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            document.getElementById('view-sub-btn').style.display = (tabName === 'solution') ? 'block' : 'none';

            if(tabName === 'notes') {
                editor.setOption("readOnly", false);
                const content = localStorage.getItem(`cf_note_${state.activeProblem.id}`) || `// ${state.activeProblem.name}\n#include <bits/stdc++.h>\nusing namespace std;\n\nvoid solve() {\n    \n}\n\nint main() {\n    ios::sync_with_stdio(0); cin.tie(0);\n    int t; cin >> t;\n    while(t--) solve();\n}`;
                editor.setValue(content);
                document.getElementById('save-indicator').innerText = "Notes Loaded";
            } else {
                editor.setOption("readOnly", true);
                editor.setValue("// Loading Solution...");
                const subId = state.submissionMap.get(state.activeProblem.id);
                if(subId) fetchSolutionCode(state.activeProblem.cid, subId);
                else editor.setValue("// No solution found.\n// Make sure to Click 'Sync Status' so we can fetch your latest submission IDs.");
            }
        }

        async function fetchSolutionCode(cid, subId) {
            const url = `https://codeforces.com/contest/${cid}/submission/${subId}`;
            try {
                const proxy = `https://corsproxy.io/?${encodeURIComponent(url)}`;
                const res = await fetch(proxy);
                const html = await res.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, "text/html");
                const code = doc.querySelector("#program-source-text");
                if(code) {
                    editor.setValue(code.innerText);
                    document.getElementById('save-indicator').innerText = "Solution Loaded";
                } else { editor.setValue("// Could not parse code.\n// Codeforces might be blocking the proxy.\n// Use the 'View on CF' button above."); }
            } catch(e) { editor.setValue("// Error fetching code.\n// Use the 'View on CF' button above."); }
        }
        
        function openExternalSub() {
            const subId = state.submissionMap.get(state.activeProblem.id);
            if(subId) window.open(`https://codeforces.com/contest/${state.activeProblem.cid}/submission/${subId}`, '_blank');
            else alert("No submission ID found. Please Sync.");
        }

        async function openEditor(pid, cid, idx, name) {
            state.activeProblem = { id: pid, cid, idx, name };
            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('editor-container').style.display = 'flex';
            document.getElementById('active-title').innerText = `${idx}. ${name}`;
            switchTab('notes');
            if(state.user) {
                const noteRef = db.collection('users').doc(state.user.uid).collection('notes').doc(pid);
                noteRef.get().then(doc => {
                    if(doc.exists) {
                        const cloudContent = doc.data().content;
                        if(state.currentTab === 'notes' && cloudContent !== editor.getValue()) {
                            editor.setValue(cloudContent);
                            localStorage.setItem(`cf_note_${pid}`, cloudContent);
                        }
                    }
                });
            }
            setTimeout(() => editor.refresh(), 10);
        }

        editor.on('change', () => {
            if(state.activeProblem && state.currentTab === 'notes') {
                const content = editor.getValue();
                const pid = state.activeProblem.id;
                localStorage.setItem(`cf_note_${pid}`, content);
                document.getElementById('save-indicator').innerText = "Saving...";
                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(() => {
                    if(state.user) {
                        db.collection('users').doc(state.user.uid).collection('notes').doc(pid).set({ content }, { merge: true })
                        .then(() => document.getElementById('save-indicator').innerText = "Saved")
                        .catch(() => document.getElementById('save-indicator').innerText = "Save Failed");
                    } else { document.getElementById('save-indicator').innerText = "Saved Locally"; }
                }, 1000);
            }
        });

        function closeEditor() {
            state.activeProblem = null;
            document.getElementById('editor-container').style.display = 'none';
            document.getElementById('empty-state').style.display = 'flex';
        }

        function copyCode() { navigator.clipboard.writeText(editor.getValue()); }
        function submitToCF() {
            if(state.activeProblem) {
                copyCode();
                window.open(`https://codeforces.com/contest/${state.activeProblem.cid}/submit?problemIndex=${state.activeProblem.idx}`, '_blank');
            }
        }
        function toggleTheme() {
            const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('cf_theme', next);
            editor.setOption("theme", next === 'dark' ? 'ayu-mirage' : 'eclipse');
        }
        function initResizer() {
            const r = document.getElementById('resizer'), s = document.getElementById('sidebar');
            let resizing = false;
            r.addEventListener('mousedown', () => { resizing = true; document.body.style.cursor = 'col-resize'; });
            document.addEventListener('mousemove', e => { if(resizing) s.style.width = Math.max(300, Math.min(800, e.clientX)) + 'px'; });
            document.addEventListener('mouseup', () => { resizing = false; document.body.style.cursor = 'default'; });
        }

        init();
    </script>
</body>
</html>
